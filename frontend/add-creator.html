<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add Creator - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="coin-seller.css">
</head>
<body class="cs-page">
  <header class="cs-header">
    <a href="/agency-center.html?app=1"><i class="fas fa-arrow-left"></i></a>
    <h1>Add Creator</h1>
    <span style="width:36px"></span>
  </header>
  <div style="padding:16px">
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button type="button" class="cs-quick-btn" style="flex:1" id="shareInvite"><i class="fas fa-paper-plane"></i>Send Invite Link</button>
      <button type="button" class="cs-quick-btn" style="flex:1" id="copyCode"><i class="fas fa-gift"></i>Copy Invite Code</button>
    </div>
    <p id="inviteCodeHint" style="font-size:12px;color:#888;margin:-8px 0 16px">Loading agency invite code…</p>
    <div class="cs-field">
      <label>User ID or email</label>
      <input type="text" id="creatorId" placeholder="Public User ID or email">
    </div>
    <button type="button" class="cs-submit" id="inviteBtn">Send invite message</button>
    <p style="font-size:12px;color:#888;margin-top:10px">Sends a chat message so they can Accept or Reject joining your agency as Host.</p>
    <h3 style="margin-top:24px;font-size:14px">Invite Host Task</h3>
    <table class="cs-level-table">
      <thead><tr><th>On MIC Reward</th><th>Income Reward</th></tr></thead>
      <tbody>
        <tr><td>2 hours</td><td>$0.05</td></tr>
        <tr><td>5 hours</td><td>$0.10</td></tr>
        <tr><td>10 hours</td><td>$0.30</td></tr>
        <tr><td>15 hours</td><td>$0.35</td></tr>
      </tbody>
    </table>
  </div>
  <script src="ap-config.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="auth-guard.js"></script>
  <script>
    let inviteMeta = null;

    function applyUrl() {
      if (!inviteMeta?.code) return location.origin + '/role-apply.html?role=creator&app=1';
      return location.origin + '/role-apply.html?role=creator&promo=' + encodeURIComponent(inviteMeta.code) + '&app=1';
    }

    async function loadInviteCode() {
      const hint = document.getElementById('inviteCodeHint');
      try {
        const res = await API.get('/agency/invite-code');
        inviteMeta = res.data || {};
        if (hint) {
          hint.innerHTML = `Agency code: <strong style="letter-spacing:0.06em">${inviteMeta.code || '—'}</strong>
            · Hosts use this on Apply for Host`;
        }
      } catch (e) {
        if (hint) hint.textContent = e.message || 'Could not load invite code';
      }
    }

    document.getElementById('copyCode')?.addEventListener('click', async () => {
      if (!inviteMeta?.code) {
        await loadInviteCode();
      }
      if (!inviteMeta?.code) return alert('Invite code unavailable');
      try {
        await navigator.clipboard?.writeText(inviteMeta.code);
        alert('Invite code copied: ' + inviteMeta.code + '\n\nShare with hosts to apply.');
      } catch (_e) {
        prompt('Copy this agency invite code:', inviteMeta.code);
      }
    });

    document.getElementById('shareInvite')?.addEventListener('click', async () => {
      if (!inviteMeta?.code) await loadInviteCode();
      const url = applyUrl();
      const text = `Join my agency as a Host on AP Services. Apply here: ${url}`;
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Join as Host', text, url });
          return;
        } catch (_e) { /* fall through */ }
      }
      try {
        await navigator.clipboard?.writeText(url);
        alert('Invite link copied:\n' + url);
      } catch (_e) {
        prompt('Copy invite link:', url);
      }
    });

    document.getElementById('inviteBtn')?.addEventListener('click', async () => {
      const id = document.getElementById('creatorId').value.trim();
      if (!id) return alert('Enter public User ID or email');
      const btn = document.getElementById('inviteBtn');
      btn.disabled = true;
      try {
        const res = await API.post('/agency/invite-host', { user_ref: id });
        const peer = res.data?.invitee;
        const label = peer?.email || peer?.display_id || id;
        alert(res.message || ('Invite sent to ' + label));
        document.getElementById('creatorId').value = '';
        if (peer?.id && confirm('Open chat with this user?')) {
          location.href = '/chat.html?id=' + encodeURIComponent(peer.id) + '&app=1';
        }
      } catch (e) {
        alert(e.message || 'Invite failed');
      } finally {
        btn.disabled = false;
      }
    });

    (async function init() {
      Auth.checkAuth();
      if (!Auth.hasSession?.()) {
        location.href = '/login.html?redirect=' + encodeURIComponent('/add-creator.html?app=1');
        return;
      }
      await loadInviteCode();
    })();
  </script>
</body>
</html>
