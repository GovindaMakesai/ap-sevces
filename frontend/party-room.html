<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f3a">
  <title>Party Room - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-live.css">
</head>
<body class="live-dark" data-live-page="party-room">
  <span class="live-status-badge" id="liveStatusBadge">Connecting…</span>

  <div class="party-room">
    <div class="party-room-grid-floor" aria-hidden="true"></div>

    <header class="party-header">
      <div class="party-host">
        <img id="partyHostAvatar" src="" alt="">
        <div class="party-host-meta">
          <div class="name" id="partyHostName">Host</div>
          <div class="sub"><span class="heart-stat">❤️ <span id="partyHearts">115</span></span> <span>Pop 100+</span></div>
        </div>
        <button type="button" class="party-follow-btn" id="partyHostFollow" aria-label="Follow">+</button>
      </div>
      <div class="party-header-center"><span class="party-crown">👑</span></div>
      <div class="party-header-right">
        <div class="party-viewers" id="partyViewerAvatars">
          <span></span><span></span><span></span>
          <span class="party-viewer-count" id="liveViewerCount">31</span>
        </div>
        <button type="button" class="party-close" id="partyClose" aria-label="Leave"><i class="fas fa-times"></i></button>
      </div>
    </header>

    <div class="party-ticker">
      <span class="party-ticker-inner" id="partyTicker">💎 Diamond VIP perks · Lucky Gifts Party · Send gifts to climb ranks</span>
    </div>

    <div class="party-widgets">
      <div class="party-widget">
        <strong>Team</strong> <span id="partyTeamProgress">1/16</span>
        <div class="bar"><i id="partyTeamBar" style="width:6%"></i></div>
      </div>
      <div class="party-widget"><strong>🎁 Chest</strong> <span id="partyChestTimer">04:54</span></div>
    </div>
    <a href="/lucky-gifts.html?app=1" class="party-event-pill">Lucky Gifts<br><span class="coins">🪙 268M</span></a>

    <div class="party-win-banner" id="partyWinBanner">WIN · Send gifts to win coins 🪙</div>

    <div class="party-seats-wrap">
      <div class="party-seats" id="partySeats"></div>
    </div>

    <div class="party-chat-tabs">
      <button type="button" class="active" data-tab="all">All</button>
      <button type="button" data-tab="room">Room</button>
      <button type="button" data-tab="chat">Chat</button>
    </div>

    <div class="party-chat-zone">
      <div class="party-chat-feed" id="partyChatFeed"></div>
    </div>

    <div class="live-chat-compose is-open" id="liveChatCompose">
      <input type="text" id="liveChatInput" placeholder="Say something…" maxlength="280" autocomplete="off">
      <button type="button" id="liveChatSend" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
    </div>

    <footer class="party-bottom-bar">
      <button type="button" class="party-btn-follow" id="partyBtnFollow">Follow +</button>
      <div class="party-bottom-actions">
        <button type="button" id="partyBtnTools" aria-label="Tools"><i class="fas fa-grip"></i></button>
        <button type="button" id="liveBtnMic" aria-label="Mic"><i class="fas fa-microphone"></i></button>
        <button type="button" id="partyBtnGift" class="party-btn-gift" aria-label="Gifts"><i class="fas fa-gift"></i></button>
      </div>
    </footer>
  </div>

  <div class="party-tools-sheet" id="partyToolsSheet">
    <div class="party-tools-panel">
      <h3>Basic Tools</h3>
      <div class="party-tools-grid">
        <a href="/chat.html?app=1"><span class="ico msg"><i class="fas fa-envelope"></i></span>Message</a>
        <button type="button" id="partyBtnSound"><span class="ico sound"><i class="fas fa-volume-up"></i></span>Sound</button>
        <button type="button" id="partyBtnShare"><span class="ico share"><i class="fas fa-share"></i></span>Share</button>
        <button type="button" id="partyBtnReport"><span class="ico report"><i class="fas fa-exclamation-circle"></i></span>Report</button>
        <button type="button" id="partyToolsClose"><span class="ico" style="background:#6b7280"><i class="fas fa-compress"></i></span>Close</button>
      </div>
      <h3>Playstyle</h3>
      <div class="party-tools-grid">
        <a href="/coins-recharge.html?app=1"><span class="ico coins"><i class="fas fa-coins"></i></span>Recharge</a>
        <a href="/store.html?app=1"><span class="ico store"><i class="fas fa-shopping-bag"></i></span>Store</a>
        <a href="/vip.html?app=1"><span class="ico vip"><i class="fas fa-gem"></i></span>VIP</a>
        <a href="/rankings.html?app=1"><span class="ico" style="background:#3b82f6"><i class="fas fa-shield-alt"></i></span>Guardian</a>
        <a href="/store.html?app=1"><span class="ico" style="background:#0ea5e9"><i class="fas fa-backpack"></i></span>Backpack</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="app.js"></script>
  <script src="auth-guard.js"></script>
  <script src="social-shell.js"></script>
  <script src="social-live.js"></script>
</body>
</html>
