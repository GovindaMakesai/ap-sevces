<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <title>Profile - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css?v=20260628-profile-fix">
  <link rel="stylesheet" href="social-features.css?v=20260730-cx2">
  <style>
    .creator-hero { text-align: center; padding: 24px 16px 12px; }
    .creator-avatar { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 3px solid #fbbf24; }
    .creator-actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; position: relative; z-index: 5; }
    .creator-follow-btn, .creator-chat-btn {
      border: none; border-radius: 999px; padding: 10px 20px; font-weight: 700; cursor: pointer;
      touch-action: manipulation; pointer-events: auto; position: relative; z-index: 6;
    }
    .creator-follow-btn { background: #fbbf24; color: #1a1000; }
    .creator-follow-btn.is-on { background: #e5e7eb; color: #374151; }
    .creator-chat-btn { background: #111827; color: #fff; }
    .creator-earnings-note {
      margin: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(251, 191, 36, 0.12);
      font-size: 13px; color: #78350f; text-align: center;
    }
    .creator-engagement-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 0 16px 16px;
    }
    .creator-engagement-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .creator-engagement-card {
      background: #fff;
      border: 1px solid rgba(201, 162, 39, 0.25);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
    }
    .creator-engagement-card strong {
      display: block;
      font-size: 18px;
      color: #92400e;
      margin-bottom: 4px;
    }
    .creator-engagement-card span {
      font-size: 11px;
      color: #8b6914;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 600;
    }
    .creator-live-banner {
      margin: 0 16px 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      color: #991b1b;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .creator-agency-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(201, 162, 39, 0.15);
      color: #78350f;
      font-size: 12px;
      font-weight: 700;
    }
    .creator-tabs {
      display: flex;
      gap: 0;
      margin: 8px 16px 0;
      border-bottom: 1px solid rgba(201, 162, 39, 0.25);
    }
    .creator-tab {
      flex: 1;
      text-align: center;
      padding: 12px 8px;
      border: none;
      background: transparent;
      color: #8b6914;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .creator-tab.is-active {
      color: #6b4f10;
      border-bottom-color: #c9a227;
    }
    .creator-tab-count {
      font-weight: 600;
      opacity: 0.75;
      font-size: 12px;
    }
    .profile-loading .creator-avatar { background: #e5e7eb; animation: pulse 1.2s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .creator-actions button { pointer-events: auto; touch-action: manipulation; }
  </style>
  <script src="native-session-restore.js"></script>
  <script src="ap-config.js"></script>
  <script src="ap-native-boot.js"></script>
</head>
<body class="social-profile-page">
  <header class="social-store-header">
    <a href="javascript:history.back()" class="social-icon-btn"><i class="fas fa-arrow-left"></i></a>
    <h1 id="creatorTitle">Profile</h1>
    <span style="width:36px"></span>
  </header>

  <section class="creator-hero profile-loading" id="creatorHero">
    <div class="creator-avatar" id="creatorAvatarPlaceholder"></div>
    <h2 id="creatorName">Loading…</h2>
  </section>
  <div class="creator-earnings-note">
    <strong>Creator earnings:</strong> You keep <strong>90%</strong> of gifts &amp; bookings · Platform share <strong>10%</strong>
  </div>
  <a id="creatorLiveBanner" class="creator-live-banner" hidden></a>
  <div id="creatorFeatured" hidden></div>
  <div class="creator-engagement-grid" id="creatorEngagement" hidden></div>
  <div class="creator-tabs" id="creatorTabs" hidden>
    <button type="button" class="creator-tab is-active" data-tab="posts">Posts <span class="creator-tab-count" id="tabPostsCount"></span></button>
    <button type="button" class="creator-tab" data-tab="videos">Videos <span class="creator-tab-count" id="tabVideosCount"></span></button>
  </div>
  <div class="social-post-feed" id="creatorPosts"></div>
  <div id="social-bottom-nav-mount"></div>

  <script src="app.js?v=20260702-follow-fix"></script>
  <script src="auth-guard.js"></script>
  <script src="social-ui.js?v=20260702-follow-fix"></script>
  <script src="social-creator-identity.js?v=20260730-cx2"></script>
  <script src="social-interactions.js?v=20260730-cx2"></script>
  <script src="social-shell.js"></script>
  <script>
    function profileApiRoot() {
      return (window.AP_SERVICES_API_ROOT || 'https://api.apservices.in/api').replace(/\/+$/, '');
    }

    function requireAuthForAction() {
      const authed = (window.Auth?.hasSession?.() || window.Auth?.getToken?.() || localStorage.getItem('token'));
      if (authed) return true;
      const redirect = encodeURIComponent(location.pathname + location.search);
      location.href = '/app-auth.html?app=1&redirect=' + redirect;
      return false;
    }

    function esc(s) {
      return String(s || '').replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
    }

    document.addEventListener('DOMContentLoaded', async () => {
      SocialShell.initPage({ activeNav: 'video' });
      if (window.Auth?.ensureAccessToken) await Auth.ensureAccessToken().catch(() => {});
      if (window.SocialInteractions?.refreshFollowCache) {
        await SocialInteractions.refreshFollowCache().catch(() => {});
      }
      const params = new URLSearchParams(location.search);
      const userId = (params.get('userId') || params.get('id') || '').trim();
      const name = (window.SocialUI?.safeDecodeURIComponent || ((v) => { try { return decodeURIComponent(v); } catch (_e) { return v; } }))(params.get('name') || 'User');
      document.getElementById('creatorTitle').textContent = name;
      document.getElementById('creatorName').textContent = name;

      const hero = document.getElementById('creatorHero');
      hero.classList.remove('profile-loading');
      const uidBlock = userId
        ? '<p class="creator-user-id">ID: <strong id="creatorDisplayId">…</strong> <button type="button" class="creator-copy-id" id="creatorCopyId" aria-label="Copy ID"><i class="fas fa-copy"></i></button></p>'
        : '';
      hero.innerHTML =
        '<img class="creator-avatar" src="' + SocialUI.avatarUrl(name) + '" alt="">' +
        '<h2 id="creatorNameHeading">' + esc(name) + '</h2>' +
        '<div id="creatorAgencyWrap"></div>' +
        uidBlock +
        '<div class="creator-actions">' +
        '<button type="button" class="creator-follow-btn" id="creatorFollow">Follow</button>' +
        (userId ? '<button type="button" class="creator-chat-btn" id="creatorChat"><i class="fas fa-comment"></i> Message</button>' : '') +
        '</div>';

      const followKey = userId || name;
      let following = window.SocialInteractions?.isFollowing
        ? SocialInteractions.isFollowing(followKey, name)
        : false;
      const followBtn = document.getElementById('creatorFollow');
      const syncFollowBtn = () => {
        followBtn.textContent = following ? 'Following' : 'Follow';
        followBtn.classList.toggle('is-on', following);
      };
      syncFollowBtn();

      followBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!requireAuthForAction()) return;
        if (!userId) {
          SocialUI?.toast('Profile incomplete — missing user id', 'warning');
          return;
        }
        if (!window.SocialInteractions?.toggleFollow) {
          SocialUI?.toast('Please wait and try again', 'warning');
          return;
        }
        following = await SocialInteractions.toggleFollow(userId, name);
        syncFollowBtn();
        SocialUI.toast(following ? 'You are now following ' + name : 'Unfollowed ' + name, following ? 'success' : 'info');
      });

      document.getElementById('creatorChat')?.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!userId) {
          SocialUI?.toast('Message unavailable — user ID missing', 'warning');
          return;
        }
        if (!requireAuthForAction()) return;
        location.href = '/chat.html?id=' + encodeURIComponent(userId) + '&app=1';
      });
      let publicDisplayId = window.formatUserDisplayId?.(null, null) || '';
      document.getElementById('creatorCopyId')?.addEventListener('click', async () => {
        const copyVal = publicDisplayId || '';
        if (!copyVal) {
          SocialUI?.toast?.('User ID unavailable', 'warning');
          return;
        }
        try {
          await navigator.clipboard.writeText(String(copyVal));
          SocialUI.toast('User ID copied');
        } catch (_e) {
          alert('ID: ' + copyVal);
        }
      });

      let postsCount = 0;
      let videosCount = 0;
      let activeTab = 'posts';

      if (userId) {
        try {
          const headers = {};
          const token = (window.Auth?.getToken?.() || localStorage.getItem('token'));
          if (token) headers.Authorization = 'Bearer ' + token;
          const res = await fetch(profileApiRoot() + '/social/creators/' + encodeURIComponent(userId) + '/engagement', {
            credentials: 'include',
            headers,
          });
          const payload = await res.json();
          if (payload.success && payload.data) {
            const e = payload.data;
            publicDisplayId = window.formatUserDisplayId?.(e) || e.displayId || e.display_id || '';
            const idEl = document.getElementById('creatorDisplayId');
            if (idEl) idEl.textContent = publicDisplayId || '—';
            const displayName = e.displayName || name;
            const badges =
              (window.SocialCreatorIdentity?.renderBadgesHtml?.(e, 'profile') ||
                window.formatRoleBadgeHtml?.(e.role || e, { withEmoji: true }) ||
                '');
            const nameEl = document.getElementById('creatorNameHeading');
            if (nameEl) {
              nameEl.innerHTML = esc(displayName) + (badges ? ' ' + badges : '');
            }
            document.getElementById('creatorTitle').textContent = displayName;
            if (e.bio) {
              let bioEl = document.getElementById('creatorBio');
              if (!bioEl) {
                bioEl = document.createElement('p');
                bioEl.id = 'creatorBio';
                bioEl.className = 'creator-bio';
                const wrap = document.getElementById('creatorAgencyWrap');
                if (wrap) wrap.after(bioEl);
                else hero.appendChild(bioEl);
              }
              bioEl.textContent = e.bio;
            }
            const links = e.socialLinks || {};
            const linkEntries = [
              ['instagram', 'Instagram', links.instagram],
              ['youtube', 'YouTube', links.youtube],
              ['x', 'X', links.x],
              ['website', 'Website', links.website],
            ].filter((x) => x[2]);
            if (linkEntries.length) {
              let linksEl = document.getElementById('creatorSocialLinks');
              if (!linksEl) {
                linksEl = document.createElement('div');
                linksEl.id = 'creatorSocialLinks';
                linksEl.className = 'creator-social-links';
                hero.appendChild(linksEl);
              }
              linksEl.innerHTML = linkEntries
                .map(
                  ([, label, href]) =>
                    '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + '</a>'
                )
                .join('');
            }
            if (e.agencyName) {
              const wrap = document.getElementById('creatorAgencyWrap');
              if (wrap && !e.agencyName) { /* handled in badges */ }
              else if (wrap) {
                wrap.innerHTML =
                  '<span class="creator-agency-badge"><i class="fas fa-building"></i> ' +
                  esc(e.agencyName) +
                  '</span>';
              }
            }
            if (e.featuredVideo) {
              const feat = document.getElementById('creatorFeatured');
              const thumb =
                (window.SocialInteractions?.resolveMediaUrl?.(e.featuredVideo.thumbUrl || e.featuredVideo.mediaUrl) ||
                  e.featuredVideo.thumbUrl ||
                  '');
              feat.hidden = false;
              feat.innerHTML =
                '<a class="creator-featured" href="' +
                esc(e.featuredVideo.href) +
                '">' +
                (thumb ? '<img src="' + esc(thumb) + '" alt="">' : '') +
                '<div class="creator-featured-meta"><i class="fas fa-star"></i> Featured · ' +
                esc((e.featuredVideo.caption || 'Top video').slice(0, 60)) +
                '</div></a>';
            }
            const avatarEl = hero.querySelector('.creator-avatar');
            if (avatarEl && e.profilePic) {
              const cacheKey = e.profileUpdatedAt || e.id || userId;
              const picUrl = window.SocialShell?.getImageUrl
                ? SocialShell.getImageUrl(e.profilePic, cacheKey)
                : SocialUI.avatarUrl(displayName, e.profilePic);
              avatarEl.onerror = () => {
                avatarEl.onerror = null;
                avatarEl.src = SocialUI.avatarUrl(displayName);
              };
              avatarEl.src = picUrl;
            }
            const fmt = (n) => {
              const v = Number(n || 0);
              if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
              if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
              return String(v);
            };
            postsCount = Number(e.postsCount || 0);
            videosCount = Number(e.videosCount || 0);
            const grid = document.getElementById('creatorEngagement');
            grid.hidden = false;
            grid.className = 'creator-engagement-grid cols-3';
            grid.innerHTML =
              '<div class="creator-engagement-card"><strong>' + fmt(e.followers) + '</strong><span>Followers</span></div>' +
              '<div class="creator-engagement-card"><strong>' + fmt(e.following) + '</strong><span>Following</span></div>' +
              '<div class="creator-engagement-card"><strong>' + fmt(e.giftCount) + '</strong><span>Gifts</span></div>' +
              '<div class="creator-engagement-card"><strong>' + fmt(postsCount) + '</strong><span>Posts</span></div>' +
              '<div class="creator-engagement-card"><strong>' + fmt(videosCount) + '</strong><span>Videos</span></div>' +
              '<div class="creator-engagement-card"><strong>' + esc(e.engagementLabel) + '</strong><span>Engagement</span></div>';
            if (e.isLive && (e.liveHref || e.liveChannel)) {
              const live = document.getElementById('creatorLiveBanner');
              live.hidden = false;
              live.href = e.liveHref ||
                ('/' + (e.liveRoomType === 'party' ? 'party-room' : 'live-room') + '.html?channel=' + encodeURIComponent(e.liveChannel) + '&app=1');
              live.innerHTML = '<i class="fas fa-circle" style="font-size:8px"></i> LIVE now · ' + fmt(e.liveViewers) + ' watching — Tap to join';
            }
            if (e.isFollowing) {
              following = true;
              followBtn.textContent = 'Following';
              followBtn.classList.add('is-on');
            }
            const me = window.Auth?.getUser?.();
            if (me && String(me.id) === String(userId)) {
              followBtn.style.display = 'none';
              let editBtn = document.getElementById('creatorEditBio');
              if (!editBtn) {
                editBtn = document.createElement('button');
                editBtn.type = 'button';
                editBtn.id = 'creatorEditBio';
                editBtn.className = 'creator-chat-btn';
                editBtn.textContent = 'Edit bio & links';
                document.querySelector('.creator-actions')?.appendChild(editBtn);
                editBtn.addEventListener('click', async () => {
                  const bio = prompt('Your bio (max 280 chars)', e.bio || '');
                  if (bio === null) return;
                  const ig = prompt('Instagram URL or @handle (optional)', (e.socialLinks && e.socialLinks.instagram) || '');
                  if (ig === null) return;
                  const yt = prompt('YouTube URL (optional)', (e.socialLinks && e.socialLinks.youtube) || '');
                  if (yt === null) return;
                  try {
                    if (window.Auth?.ensureAccessToken) await Auth.ensureAccessToken();
                    await API.put('/auth/profile', {
                      bio,
                      social_links: {
                        instagram: ig || undefined,
                        youtube: yt || undefined,
                        x: e.socialLinks?.x,
                        website: e.socialLinks?.website,
                      },
                    });
                    SocialUI?.toast?.('Profile updated', 'success');
                    location.reload();
                  } catch (err) {
                    SocialUI?.toast?.(err.message || 'Could not update profile', 'error');
                  }
                });
              }
            }
          }
        } catch (_err) {
          console.warn('creator engagement', _err);
        }
      }

      const tabs = document.getElementById('creatorTabs');
      const feed = document.getElementById('creatorPosts');
      if (userId) {
        tabs.hidden = false;
        document.getElementById('tabPostsCount').textContent = postsCount ? '(' + postsCount + ')' : '';
        document.getElementById('tabVideosCount').textContent = videosCount ? '(' + videosCount + ')' : '';

        async function loadTab(tab) {
          activeTab = tab;
          tabs.querySelectorAll('.creator-tab').forEach((b) => {
            b.classList.toggle('is-active', b.dataset.tab === tab);
          });
          feed.innerHTML = SocialInteractions.renderSquareSkeleton
            ? ''
            : '';
          await SocialInteractions.renderSquareFeed(feed, {
            userId,
            mediaType: tab === 'videos' ? 'video' : 'posts',
            feed: 'latest',
          });
          /* Posts tab: non-video content; if empty also allow text-only via second pass */
          if (tab === 'posts' && !feed.querySelector('.social-post-card') && !feed.querySelector('.social-empty-state--feed h3')) {
            /* empty state already rendered */
          }
          if (tab === 'posts') {
            const empty = feed.querySelector('.social-empty-state h3');
            if (empty && /No posts/i.test(empty.textContent)) {
              empty.textContent = 'No posts yet';
            }
          }
          if (tab === 'videos') {
            const empty = feed.querySelector('.social-empty-state h3');
            if (empty) empty.textContent = 'No videos yet';
            const p = feed.querySelector('.social-empty-state p');
            if (p) p.textContent = 'When this creator uploads a video, it will appear here.';
          }
        }

        tabs.querySelectorAll('.creator-tab').forEach((btn) => {
          btn.addEventListener('click', () => loadTab(btn.dataset.tab));
        });
        await loadTab('posts');
      } else {
        feed.innerHTML =
          '<div class="social-empty-state social-empty-state--feed"><div class="illus">✦</div><h3>Profile unavailable</h3><p>Open a creator from Video or Square so we can load their posts.</p></div>';
      }
    });
  </script>
</body>
</html>
