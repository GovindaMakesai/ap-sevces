<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <title>Rankings - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
  <link rel="stylesheet" href="social-theme.css?v=20260729-instant">
  <link rel="stylesheet" href="social-features.css?v=20260816-rank-nav">
  <link rel="stylesheet" href="social-fx.css?v=20260816-rank-nav">
  <style>
    @keyframes rankSkel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body class="social-rank-page social-rank-page--gold">
  <div class="social-rank-sticky-top">
    <header class="social-rank-header">
      <a href="/explore.html?app=1" class="social-rank-back" data-ap-back aria-label="Back"><i class="fas fa-arrow-left"></i></a>
      <nav class="social-rank-main-tabs">
        <a href="#" class="social-rank-main-tab active" data-tab="host">Host</a>
        <a href="#" class="social-rank-main-tab" data-tab="rich">Rich</a>
        <a href="#" class="social-rank-main-tab" data-tab="gift">Gift</a>
        <a href="#" class="social-rank-main-tab" data-tab="video">Video</a>
        <a href="/cp-rankings.html?app=1" class="social-rank-main-tab social-rank-main-tab--cp" data-external-rank="cp">CP</a>
      </nav>
      <a href="/help.html?app=1" class="social-rank-back"><i class="fas fa-question-circle"></i></a>
    </header>

    <div class="social-rank-tabs">
      <button type="button" class="social-rank-sub-tab active" data-period="daily">Daily</button>
      <button type="button" class="social-rank-sub-tab" data-period="weekly">Weekly</button>
      <button type="button" class="social-rank-sub-tab" data-period="monthly">Monthly</button>
    </div>
  </div>

  <div data-rank-panel="host">
    <div class="social-rank-promo" id="rankPromoHost">
      <span class="flags">🇮🇳 Host Rank</span>
      <p>Top hosts by gifts received &amp; live time</p>
    </div>
    <div class="social-rank-list" id="rankListHost"></div>
  </div>
  <div data-rank-panel="rich" style="display:none">
    <div class="social-rank-promo" id="rankPromoRich">
      <span class="flags">💰 Rich Rank</span>
      <p>Top coin spenders — real gift activity</p>
    </div>
    <div class="social-rank-list" id="rankListRich"></div>
  </div>
  <div data-rank-panel="gift" style="display:none">
    <div class="social-rank-promo" id="rankPromoGift">
      <span class="flags">🎁 Gift Rank</span>
      <p>Most gifts sent by real users</p>
    </div>
    <div class="social-rank-list" id="rankListGift"></div>
  </div>
  <div data-rank-panel="video" style="display:none">
    <div class="social-rank-promo" id="rankPromoVideo">
      <span class="flags">🎬 Video Rank</span>
      <p>Top creators by posts, likes &amp; comments</p>
    </div>
    <div class="social-rank-list" id="rankListVideo"></div>
  </div>

  <div id="social-bottom-nav-mount"></div>

  <script src="app.js?v=20260729-perf2"></script>
  <script src="social-ui.js?v=20260802-rank-avatars"></script>
  <script src="social-interactions.js?v=20260717-block-hide"></script>
  <script src="ap-soft-nav.js?v=20260730-fastnav4"></script>
  <script src="social-shell.js?v=20260802-rank-avatars"></script>
  <script src="social-nav.js"></script>
  <script defer src="social-fx.js"></script>
  <script>
    const TAB_CATEGORY = { host: 'creators', rich: 'gifters', gift: 'gifters', video: 'video' };
    const TAB_MODE = { host: '', rich: '', gift: 'count', video: '' };
    const API_ROOT = (window.AP_SERVICES_API_ROOT || 'https://api.apservices.in/api').replace(/\/+$/, '');
    const urlParams = new URLSearchParams(location.search);
    let currentPeriod = ['daily', 'weekly', 'monthly'].includes(urlParams.get('period'))
      ? urlParams.get('period')
      : 'daily';
    let currentTab = urlParams.get('tab') || 'host';

    function periodLabel(period) {
      if (period === 'daily') return 'today';
      if (period === 'weekly') return 'this week';
      return 'this month';
    }

    function updatePromo() {
      const el = document.getElementById('rankPromo' + currentTab.charAt(0).toUpperCase() + currentTab.slice(1));
      if (!el) return;
      const dates = el.querySelector('.dates');
      if (dates) dates.textContent = 'Updated live · ' + periodLabel(currentPeriod);
      else {
        const span = document.createElement('span');
        span.className = 'dates';
        span.textContent = 'Updated live · ' + periodLabel(currentPeriod);
        el.appendChild(span);
      }
    }

    let rankCache = [];
    let rankVisible = 20;

    function ranksCacheKey(period, tab) {
      return `ap_ranks_v2_${period}_${tab}`;
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }

    function readRanksCache(period, tab) {
      try {
        const raw = sessionStorage.getItem(ranksCacheKey(period, tab));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed?.rows) return null;
        if (Date.now() - Number(parsed.at || 0) > 15 * 60 * 1000) return null;
        return parsed.rows;
      } catch (_e) {
        return null;
      }
    }

    function writeRanksCache(period, tab, rows) {
      try {
        sessionStorage.setItem(ranksCacheKey(period, tab), JSON.stringify({ at: Date.now(), rows: rows || [] }));
      } catch (_e) { /* ignore */ }
    }

    async function fetchRankings(period, tab) {
      const category = TAB_CATEGORY[tab] || 'creators';
      const mode = TAB_MODE[tab] || '';
      const qs = new URLSearchParams({ period, category });
      if (mode) qs.set('mode', mode);
      const token =
        localStorage.getItem('token') ||
        localStorage.getItem('access_token') ||
        (window.Auth?.getToken?.() || '');
      const headers = {};
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(`${API_ROOT}/v1/leaderboards?${qs}`, {
        credentials: 'include',
        headers,
      });
      const data = await res.json();
      if (!data.success || !Array.isArray(data.data)) return [];
      if (window.SocialInteractions?.refreshBlockCache) {
        SocialInteractions.refreshBlockCache().catch(() => {});
      }
      return data.data
        .map((row) => ({
          id: row.entity_id,
          n: row.entity_label || String(row.entity_id || '').slice(0, 8),
          s: formatScore(row.score, tab),
          pic: row.profile_pic || null,
        }))
        .filter((row) => {
          const uid = String(row.id || '').trim();
          if (!uid) return true;
          return !window.SocialInteractions?.isBlocked?.(uid);
        });
    }

    function formatScore(score, tab) {
      const n = Number(score || 0);
      const suffix = tab === 'gift' ? ' gifts' : '';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M' + suffix;
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K' + suffix;
      return String(Math.round(n)) + suffix;
    }

    function avatarUrl(row) {
      const name = row.n || 'User';
      const pic = row.pic || null;
      try {
        if (window.SocialShell?.getImageUrl && pic) {
          const abs = SocialShell.getImageUrl(pic);
          if (window.SocialUI?.avatarUrl) return SocialUI.avatarUrl(name, abs || pic);
          if (abs) return abs;
        }
        if (window.SocialUI?.avatarUrl) return SocialUI.avatarUrl(name, pic);
        if (pic) {
          if (/^https?:\/\//i.test(pic) || pic.startsWith('data:') || pic.startsWith('blob:')) return pic;
          const base = (window.CONFIG?.BACKEND_URL || '').replace(/\/$/, '');
          return base ? base + (pic.startsWith('/') ? pic : '/' + pic) : pic;
        }
      } catch (_e) { /* fall through to local initials */ }
      if (window.SocialUI?.avatarUrl) return SocialUI.avatarUrl(name);
      return pic || '';
    }

    function profileHref(row) {
      const uid = String(row?.id || '').trim();
      if (!uid) return '';
      return (
        '/creator-profile.html?userId=' +
        encodeURIComponent(uid) +
        '&name=' +
        encodeURIComponent(row.n || 'User') +
        '&app=1'
      );
    }

    function bindRankProfileNav(root) {
      if (!root) return;
      root.querySelectorAll('[data-rank-profile]').forEach((el) => {
        if (el.dataset.rankNavBound) return;
        el.dataset.rankNavBound = '1';
        const go = () => {
          const href = el.getAttribute('data-href');
          if (href) location.href = href;
        };
        el.addEventListener('click', (e) => {
          e.preventDefault();
          go();
        });
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            go();
          }
        });
      });
    }

    function bindRankAvatarFallbacks(root) {
      if (!root) return;
      root.querySelectorAll('img').forEach((img) => {
        if (img.dataset.rankAvBound) return;
        img.dataset.rankAvBound = '1';
        const name = img.dataset.name || img.alt || 'User';
        img.addEventListener('error', () => {
          img.onerror = null;
          try {
            img.src = window.SocialUI?.avatarUrl ? SocialUI.avatarUrl(name) : img.src;
          } catch (_e) { /* keep broken src */ }
        });
      });
    }

    async function refreshRanks() {
      const id = 'rankList' + currentTab.charAt(0).toUpperCase() + currentTab.slice(1);
      const el = document.getElementById(id);
      if (!el) return;
      updatePromo();
      const warm = readRanksCache(currentPeriod, currentTab);
      if (warm?.length) {
        rankCache = warm;
        rankVisible = 20;
        renderRankList(id, rankCache.slice(0, rankVisible), rankCache.length > rankVisible);
      } else {
        el.innerHTML = Array.from({ length: 6 }, () =>
          '<div class="social-rank-skel" style="height:56px;margin:8px 0;border-radius:12px;background:linear-gradient(90deg,#f5e6c8 25%,#fff8e7 50%,#f5e6c8 75%);background-size:200% 100%;animation:rankSkel 1.2s ease infinite"></div>'
        ).join('');
      }
      let rows = [];
      try {
        rows = await fetchRankings(currentPeriod, currentTab);
        rankCache = rows;
        rankVisible = 20;
        writeRanksCache(currentPeriod, currentTab, rows);
      } catch (e) {
        console.warn('rankings fetch', e);
        if (!rankCache.length) rankCache = warm || [];
      }
      renderRankList(id, rankCache.slice(0, rankVisible), rankCache.length > rankVisible);
    }

    function renderEmpty(el) {
      el.innerHTML = `<div class="social-rank-empty" style="text-align:center;padding:32px 20px;color:#8b6914">
        <div style="font-size:40px;margin-bottom:12px">🏆</div>
        <p style="font-weight:700;margin:0 0 6px">No rankings yet ${periodLabel(currentPeriod)}</p>
        <p style="font-size:13px;margin:0;opacity:0.85">Go live, send gifts, or post videos to appear here.</p>
      </div>`;
    }

    function renderPodium(rows) {
      const top = rows.slice(0, 3);
      if (!top.length) return '';
      const order = top.length >= 3 ? [top[1], top[0], top[2]] : top;
      const ranks = top.length >= 3 ? [2, 1, 3] : top.map((_, i) => i + 1);
      return `<div class="social-rank-podium">${order.map((r, i) => {
        const href = profileHref(r);
        const cls = 'social-rank-podium-item rank-' + ranks[i];
        const inner =
          (ranks[i] === 1 ? '<span class="podium-crown">👑</span>' : '') +
          '<img class="podium-av" src="' +
          escapeAttr(avatarUrl(r)) +
          '" alt="" data-name="' +
          escapeAttr(r.n || 'User') +
          '" decoding="async">' +
          '<strong>' +
          escapeHtml(r.n) +
          '</strong><br><small>' +
          escapeHtml(r.s) +
          '</small>';
        return href
          ? '<div class="' + cls + '" data-rank-profile data-href="' + escapeAttr(href) + '" role="link" tabindex="0">' + inner + '</div>'
          : '<div class="' + cls + '">' + inner + '</div>';
      }).join('')}</div>`;
    }

    function renderRankList(id, rows, hasMore) {
      const el = document.getElementById(id);
      if (!el) return;
      if (!rows.length) {
        renderEmpty(el);
        return;
      }
      const rest = rows.slice(3);
      el.innerHTML =
        renderPodium(rows) +
        rest
          .map(
            (r, i) => {
              const href = profileHref(r);
              return `
        <div class="social-rank-row" style="animation-delay:${(i + 3) * 0.06}s">
          ${href
            ? `<div class="social-rank-row-main" data-rank-profile data-href="${escapeAttr(href)}" role="link" tabindex="0">
          <span class="rank-num">${i + 4}</span>
          <img src="${escapeAttr(avatarUrl(r))}" alt="" data-name="${escapeAttr(r.n || 'User')}" loading="lazy" decoding="async">
          <div class="rank-info"><strong>${escapeHtml(r.n)}</strong> 🇮🇳<br><small>${escapeHtml(r.s)}</small></div>
          </div>`
            : `<div class="social-rank-row-main">
          <span class="rank-num">${i + 4}</span>
          <img src="${escapeAttr(avatarUrl(r))}" alt="" data-name="${escapeAttr(r.n || 'User')}" loading="lazy" decoding="async">
          <div class="rank-info"><strong>${escapeHtml(r.n)}</strong> 🇮🇳<br><small>${escapeHtml(r.s)}</small></div>
          </div>`}
          <button type="button" class="social-rank-follow ap-pressable" data-user-id="${escapeAttr(r.id || '')}">Follow</button>
        </div>`;
            }
          )
          .join('') +
        (hasMore
          ? '<button type="button" class="social-rank-load-more" id="rankLoadMore">Load more</button>'
          : '');
      bindRankAvatarFallbacks(el);
      bindRankProfileNav(el);
      window.SocialUI?.bindAvatarFallbacks?.(el);
      el.querySelector('#rankLoadMore')?.addEventListener('click', () => {
        rankVisible += 20;
        renderRankList(id, rankCache.slice(0, rankVisible), rankCache.length > rankVisible);
      });
      el.querySelectorAll('.social-rank-follow').forEach((b) => {
        const uid = b.dataset.userId;
        if (uid && window.SocialInteractions?.isFollowing?.(uid)) {
          b.textContent = 'Following';
          b.classList.add('is-on');
        }
        b.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!uid || !window.SocialInteractions?.toggleFollow) {
            window.SocialFX?.showFollowBurst?.(b);
            return;
          }
          try {
            const now = await SocialInteractions.toggleFollow(uid);
            b.textContent = now ? 'Following' : 'Follow';
            b.classList.toggle('is-on', now);
            window.SocialFX?.showFollowBurst?.(b);
          } catch (_e) {
            window.SocialFX?.showFollowBurst?.(b);
          }
        });
      });
    }

    function setPeriod(period, pushUrl) {
      currentPeriod = ['daily', 'weekly', 'monthly'].includes(period) ? period : 'daily';
      document.querySelectorAll('.social-rank-sub-tab').forEach((t) => {
        t.classList.toggle('active', t.dataset.period === currentPeriod);
      });
      if (pushUrl !== false) {
        const p = new URLSearchParams(location.search);
        p.set('period', currentPeriod);
        p.set('app', '1');
        history.replaceState(null, '', '/rankings.html?' + p.toString());
      }
      refreshRanks();
    }

    document.addEventListener('DOMContentLoaded', () => {
      SocialShell.initPage({ activeNav: 'rankings' });
      if (window.SocialInteractions?.refreshSocialCaches) {
        SocialInteractions.refreshSocialCaches().catch(() => {});
      }
      document.querySelectorAll('.social-rank-main-tab').forEach((tab) => {
        if (tab.dataset.externalRank || tab.classList.contains('social-rank-main-tab--cp')) return;
        tab.classList.toggle('active', tab.dataset.tab === currentTab);
        tab.addEventListener('click', (e) => {
          e.preventDefault();
          document.querySelectorAll('.social-rank-main-tab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          currentTab = tab.dataset.tab || 'host';
          document.querySelectorAll('[data-rank-panel]').forEach((p) => {
            p.style.display = p.dataset.rankPanel === currentTab ? '' : 'none';
          });
          const p = new URLSearchParams(location.search);
          p.set('tab', currentTab);
          p.set('app', '1');
          history.replaceState(null, '', '/rankings.html?' + p.toString());
          refreshRanks();
        });
      });
      document.querySelectorAll('[data-rank-panel]').forEach((p) => {
        p.style.display = p.dataset.rankPanel === currentTab ? '' : 'none';
      });
      document.querySelectorAll('.social-rank-sub-tab').forEach((t) => {
        t.classList.toggle('active', t.dataset.period === currentPeriod);
      });
      refreshRanks();
      window.refreshRanks = refreshRanks;
      if (window.SocialNav) {
        SocialNav.registerRefresh(refreshRanks);
      }
      document.querySelectorAll('.social-rank-sub-tab[data-period]').forEach((tab) => {
        tab.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (tab.dataset.period === currentPeriod) return;
          setPeriod(tab.dataset.period || 'daily');
          window.SocialFX?.confetti?.({ count: 20, originY: 0.2 });
        }, { passive: false });
      });
      window.setRankingsPeriod = (period) => setPeriod(period);
    });
  </script>
</body>
</html>
