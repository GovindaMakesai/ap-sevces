<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <title>Rankings - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="social-features.css">
  <link rel="stylesheet" href="social-fx.css">
</head>
<body class="social-rank-page social-rank-page--gold">
  <header class="social-rank-header">
    <a href="/explore.html?app=1" class="social-rank-back"><i class="fas fa-arrow-left"></i></a>
    <nav class="social-rank-main-tabs">
      <a href="#" class="social-rank-main-tab active" data-tab="host">Host</a>
      <a href="#" class="social-rank-main-tab" data-tab="rich">Rich</a>
      <a href="#" class="social-rank-main-tab" data-tab="gift">Gift</a>
      <a href="#" class="social-rank-main-tab" data-tab="video">Video</a>
    </nav>
    <a href="/help.html?app=1" class="social-rank-back"><i class="fas fa-question-circle"></i></a>
  </header>

  <div class="social-rank-tabs">
    <button type="button" class="social-rank-sub-tab active" data-period="daily">Daily</button>
    <button type="button" class="social-rank-sub-tab" data-period="weekly">Weekly</button>
    <button type="button" class="social-rank-sub-tab" data-period="monthly">Monthly</button>
    <button type="button" class="social-rank-sub-tab">Rocket Host</button>
  </div>

  <div data-rank-panel="host">
    <div class="social-rank-promo">
      <span class="flags">🇮🇳 Weekly Host Rank</span>
      <p>Top hosts win coins — live ≥ 3 hours</p>
      <span class="dates">18/05/2026 - 28/05/2026 (UTC+8)</span>
    </div>
    <div class="social-rank-list" id="rankListHost"></div>
  </div>
  <div data-rank-panel="rich" style="display:none">
    <div class="social-rank-promo"><span class="flags">💰 Rich Rank</span><p>Top spenders this week</p></div>
    <div class="social-rank-list" id="rankListRich"></div>
  </div>
  <div data-rank-panel="gift" style="display:none">
    <div class="social-rank-promo"><span class="flags">🎁 Gift Rank</span><p>Most gifts sent</p></div>
    <div class="social-rank-list" id="rankListGift"></div>
  </div>
  <div data-rank-panel="video" style="display:none">
    <div class="social-rank-promo"><span class="flags">🎬 Video Rank</span><p>Top video creators</p></div>
    <div class="social-rank-list" id="rankListVideo"></div>
  </div>

  <div id="social-bottom-nav-mount"></div>

  <script src="app.js"></script>
  <script src="social-interactions.js"></script>
  <script src="social-shell.js"></script>
  <script src="social-fx.js"></script>
  <script>
    const RANK_DATA = {
      host: [
        { n: 'Varsace', s: '25.6M' }, { n: 'Kuldeep', s: '18.4M' }, { n: 'Affy', s: '12.1M' },
        { n: 'Riya Live', s: '9.2M' }, { n: 'Rockstar', s: '7.1M' },
      ],
      rich: [
        { n: 'MAAAA', s: '8.2M' }, { n: 'Riya', s: '6.1M' }, { n: 'Singhni', s: '4.8M' },
        { n: 'Murshad', s: '3.9M' }, { n: 'Neetu', s: '3.1M' },
      ],
      gift: [
        { n: 'Murshad', s: '520K gifts' }, { n: 'Neetu', s: '410K' }, { n: 'Ayan', s: '380K' },
        { n: 'Priya', s: '290K' }, { n: 'Jeetu', s: '210K' },
      ],
      video: [
        { n: 'Jeetu_live', s: '2.1M views' }, { n: 'Somii', s: '1.8M' }, { n: 'Rockstar', s: '1.2M' },
        { n: 'Angel', s: '980K' }, { n: 'SAM', s: '760K' },
      ],
    };

    function avatarUrl(name) {
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(name.slice(0, 2))}&background=c9a227&color=fff`;
    }

    function renderPodium(rows) {
      const top = rows.slice(0, 3);
      if (top.length < 3) return '';
      const order = [top[1], top[0], top[2]];
      const ranks = [2, 1, 3];
      return `<div class="social-rank-podium">${order.map((r, i) => `
        <div class="social-rank-podium-item rank-${ranks[i]}">
          ${ranks[i] === 1 ? '<span class="podium-crown">👑</span>' : ''}
          <img class="podium-av" src="${avatarUrl(r.n)}" alt="">
          <strong>${r.n}</strong><br><small>${r.s}</small>
        </div>`).join('')}</div>`;
    }

    function renderRankList(id, rows) {
      const el = document.getElementById(id);
      if (!el) return;
      const rest = rows.slice(3);
      el.innerHTML = renderPodium(rows) + rest.map((r, i) => `
        <div class="social-rank-row" style="animation-delay:${(i + 3) * 0.06}s">
          <span class="rank-num">${i + 4}</span>
          <img src="${avatarUrl(r.n)}" alt="">
          <div class="rank-info"><strong>${r.n}</strong> 🇮🇳<br><small>${r.s}</small></div>
          <button type="button" class="social-rank-follow ap-pressable">Follow</button>
        </div>`).join('');
      el.querySelectorAll('.social-rank-follow').forEach((b) => {
        b.addEventListener('click', () => {
          b.textContent = 'Following';
          b.disabled = true;
          window.SocialFX?.showFollowBurst?.(b);
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      SocialShell.initPage({ activeNav: 'rankings' });
      Object.keys(RANK_DATA).forEach((k) =>
        renderRankList('rankList' + k.charAt(0).toUpperCase() + k.slice(1), RANK_DATA[k])
      );
      SocialInteractions.initRankingsPage();
      document.querySelectorAll('.social-rank-sub-tab[data-period]').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.social-rank-sub-tab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          window.SocialFX?.confetti?.({ count: 20, originY: 0.2 });
        });
      });
    });
  </script>
</body>
</html>
