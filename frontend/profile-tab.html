<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9a227">
  <title>Me - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="social-features.css">
  <style>
    html:not(.profile-ready) .social-profile-hero,
    html:not(.profile-ready) .social-menu-list { opacity: 0; pointer-events: none; }
    html.profile-ready .social-profile-hero,
    html.profile-ready .social-menu-list { opacity: 1; transition: opacity 0.2s ease; }
    .profile-loading-bar {
      height: 3px; background: linear-gradient(90deg, #e8c56a, #c9a227, #e8c56a);
      background-size: 200% 100%; animation: profile-load 1s linear infinite;
    }
    @keyframes profile-load { to { background-position: 200% 0; } }
    .profile-gender-card {
      margin: 0 16px 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid rgba(201, 162, 39, 0.2);
      box-shadow: 0 4px 12px rgba(107, 79, 16, 0.06);
    }
    .profile-gender-card label { display: block; font-size: 12px; font-weight: 700; color: #78350f; margin-bottom: 8px; }
    .profile-gender-card select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(201, 162, 39, 0.35); font-size: 14px; margin-bottom: 8px;
    }
    .profile-gender-card p { margin: 0 0 10px; font-size: 11px; color: #92400e; line-height: 1.4; }
    .profile-gender-card button {
      width: 100%; border: none; border-radius: 999px; padding: 10px;
      background: linear-gradient(135deg, #ff8c42, #c9a227); color: #fff; font-weight: 800; cursor: pointer;
    }
  </style>
  <script>
    (function () {
      try {
        if (localStorage.getItem('user')) {
          document.documentElement.classList.add('profile-authed');
        }
      } catch (_e) {}
    })();
  </script>
</head>
<body class="social-profile-page">
  <div class="profile-loading-bar" id="profileLoadingBar"></div>
  <div class="social-profile-hero">
    <img id="profileAvatar" src="" alt="Profile">
    <h2 id="profileName">&nbsp;</h2>
    <p id="profileRole">&nbsp;</p>
    <div class="social-profile-stats" id="profileStats" style="display:none">
      <button type="button" class="social-stat-pill" id="statFollowingBtn" aria-label="View following">
        <strong id="statFollowing">0</strong>
        <span>Following</span>
      </button>
      <button type="button" class="social-stat-pill" id="statFollowersBtn" aria-label="View followers">
        <strong id="statFollowers">0</strong>
        <span>Followers</span>
      </button>
      <a href="/store.html?app=1" class="social-stat-pill social-stat-coins">
        <strong id="statCoins">0</strong>
        <span>Coins</span>
      </a>
      <a href="/points.html?app=1" class="social-stat-pill social-stat-points">
        <strong id="statPoints">0</strong>
        <span>Points</span>
      </a>
    </div>
    <div class="social-profile-wallet" id="profileWalletActions">
      <a href="/coins-recharge.html?app=1" class="social-wallet-btn social-wallet-btn-topup">
        <i class="fas fa-plus-circle"></i> Top Up
      </a>
      <a href="/withdraw.html?app=1" class="social-wallet-btn social-wallet-btn-withdraw">
        <i class="fas fa-wallet"></i> Withdraw
      </a>
    </div>
    <button type="button" class="social-btn-orange social-profile-cta" id="profileMainBtn">Sign In</button>
  </div>

  <div class="profile-gender-card" id="profileGenderCard" style="display:none">
    <label for="profileGender">Gender</label>
    <p id="profileGenderHint">Female accounts can send up to 5 starter messages. Your remaining count appears in chat.</p>
    <select id="profileGender">
      <option value="">Not set</option>
      <option value="female">Female</option>
      <option value="male">Male</option>
      <option value="other">Other</option>
    </select>
    <button type="button" id="saveGenderBtn">Save gender</button>
  </div>

  <nav class="social-menu-list">
    <a href="#" class="social-menu-item" id="adminDashLink" style="display:none"><i class="fas fa-shield-alt"></i><span>Admin Dashboard</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="#" class="social-menu-item" id="dashLink"><i class="fas fa-th-large"></i><span>My Dashboard</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="/customer-dashboard.html#bookings" class="social-menu-item"><i class="fas fa-calendar-check"></i><span>My Bookings</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="/store.html" class="social-menu-item"><i class="fas fa-store"></i><span>Store</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="/vip.html" class="social-menu-item"><i class="fas fa-crown"></i><span>VIP Privileges</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="/rankings.html" class="social-menu-item"><i class="fas fa-trophy"></i><span>Rankings</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="/chat.html" class="social-menu-item"><i class="fas fa-comments"></i><span>Messages</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="/services.html" class="social-menu-item"><i class="fas fa-tools"></i><span>Browse Services</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="/become-a-pro.html" class="social-menu-item"><i class="fas fa-user-tie"></i><span>Become a Pro</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="/help.html" class="social-menu-item"><i class="fas fa-question-circle"></i><span>Help</span><i class="fas fa-chevron-right chevron"></i></a>
    <a href="#" class="social-menu-item" id="logoutBtn" style="display:none"><i class="fas fa-sign-out-alt"></i><span>Logout</span><i class="fas fa-chevron-right chevron"></i></a>
  </nav>

  <div id="social-bottom-nav-mount"></div>

  <script src="app.js"></script>
  <script src="social-wallet.js"></script>
  <script src="social-ui.js"></script>
  <script src="social-interactions.js"></script>
  <script src="social-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Auth.checkAuth();
      if (Auth.hasSession?.()) {
        await Auth.ensureAccessToken?.();
        try {
          await Auth.refreshSession?.();
        } catch (_e) {}
      }
      let user = Auth.getUser();

      SocialShell.initPage({ activeNav: 'profile' });
      const btn = document.getElementById('profileMainBtn');
      const dash = document.getElementById('dashLink');
      const adminDash = document.getElementById('adminDashLink');
      const logout = document.getElementById('logoutBtn');
      const statsEl = document.getElementById('profileStats');
      const loadingBar = document.getElementById('profileLoadingBar');

      function finishProfile() {
        if (loadingBar) loadingBar.remove();
        document.documentElement.classList.add('profile-ready');
      }

      if (user) {
        const name = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.email || 'User';
        document.getElementById('profileName').textContent = name;
        const roleLabel =
          user.role === 'worker' ? 'Professional' : user.role === 'admin' ? 'Administrator' : 'Customer';
        document.getElementById('profileRole').textContent = roleLabel + (user.email ? ' · ' + user.email.split('@')[0] : '');
        const pic = user.profile_pic ? SocialShell.getImageUrl(user.profile_pic) : null;
        document.getElementById('profileAvatar').src =
          window.SocialUI ? SocialUI.avatarUrl(name, pic) : pic || SocialShell.avatarFallback(name);
        if (user.role === 'admin' && adminDash) {
          adminDash.style.display = 'flex';
          adminDash.href = '/admin-dashboard.html?app=1';
        }
        statsEl.style.display = 'grid';
        const walletActs = document.getElementById('profileWalletActions');
        if (walletActs) walletActs.classList.add('is-visible');
        const genderCard = document.getElementById('profileGenderCard');
        const genderSel = document.getElementById('profileGender');
        if (genderCard) genderCard.style.display = 'block';
        if (genderSel && user.gender) genderSel.value = user.gender;
        document.getElementById('saveGenderBtn')?.addEventListener('click', async () => {
          const g = genderSel?.value || '';
          if (!g) {
            SocialUI?.toast?.('Select a gender first', 'warning');
            return;
          }
          try {
            const res = await API.patch('/auth/profile', { gender: g });
            const updated = res?.data?.user;
            if (updated) {
              const stored = Auth.getUser() || {};
              localStorage.setItem('user', JSON.stringify({ ...stored, gender: updated.gender }));
            }
            SocialUI?.toast?.('Gender saved', 'success');
          } catch (e) {
            SocialUI?.toast?.(e?.message || 'Could not save gender', 'error');
          }
        });
        if (window.SocialWallet) {
          SocialWallet.fetchBalance().then((b) => {
            const coins = document.getElementById('statCoins');
            const pts = document.getElementById('statPoints');
            if (coins) coins.textContent = (b.coin_balance || 0).toLocaleString();
            if (pts) pts.textContent = (b.star_balance || 0).toLocaleString();
          });
        }
        if (window.SocialInteractions?.getFollowStats) {
          const s = await SocialInteractions.getFollowStats(user.id);
          document.getElementById('statFollowing').textContent = s.following;
          document.getElementById('statFollowers').textContent = s.followers;
          if (!window.SocialWallet) {
            document.getElementById('statCoins').textContent = s.coins.toLocaleString();
          }
        }
        document.getElementById('statFollowingBtn')?.addEventListener('click', () => {
          const list = SocialInteractions.getFollowingList().map((e) => ({
            name: e.name,
            userId: e.id || e.key,
          }));
          SocialUI.openFollowSheet('following', list);
        });
        document.getElementById('statFollowersBtn')?.addEventListener('click', () => {
          const list = SocialInteractions.getFollowersList(user.id);
          SocialUI.openFollowSheet('followers', list);
        });
        btn.textContent = user.role === 'admin' ? 'Open Admin Dashboard' : 'Open Dashboard';
        btn.onclick = () => SocialShell.redirectToDashboard();
        dash.onclick = (e) => { e.preventDefault(); SocialShell.redirectToDashboard(); };
        logout.style.display = 'flex';
        logout.onclick = (e) => { e.preventDefault(); Auth.logout(); };
      } else {
        document.getElementById('profileName').textContent = 'Guest';
        document.getElementById('profileRole').textContent = 'Sign in to continue';
        document.getElementById('profileAvatar').src = SocialShell.avatarFallback('Guest');
        btn.textContent = 'Sign In';
        btn.onclick = () => {
          location.href = '/login.html?redirect=' + encodeURIComponent('/profile-tab.html?app=1');
        };
        dash.href = '/app-auth.html?app=1';
      }
      if (window.SocialUI) SocialUI.bindAvatarFallbacks(document);
      finishProfile();
    });
  </script>
</body>
</html>
