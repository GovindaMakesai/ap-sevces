<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Champ Car</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(180deg, #0f766e, #042f2e);
      color: #ccfbf1; font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 20px 16px;
      touch-action: manipulation;
    }
    h1 { font-size: 1.35rem; }
    p { font-size: 0.85rem; opacity: 0.9; text-align: center; max-width: 320px; }
    .track {
      width: 100%; max-width: 340px; height: 160px; margin: 20px 0;
      background: #134e4a; border-radius: 16px; position: relative; overflow: hidden;
      border: 2px solid #5eead4;
    }
    .lane {
      position: absolute; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.25);
      top: 50%;
    }
    .car {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 2.5rem; transition: left 1.2s ease-out;
    }
    .finish {
      position: absolute; right: 12px; top: 8px; bottom: 8px; width: 6px;
      background: repeating-linear-gradient(#fff, #fff 8px, #000 8px, #000 16px);
      border-radius: 2px;
    }
    button {
      background: #14b8a6; color: #042f2e; border: none; padding: 14px 28px;
      border-radius: 14px; font-weight: 900; font-size: 1rem;
    }
    button:disabled { opacity: 0.5; }
    #status { margin-top: 16px; text-align: center; min-height: 48px; font-weight: 800; }
  </style>
</head>
<body>
  <h1>🏎️ Champ Car</h1>
  <p>Race demo — in the app this opens the Reddy betting flow from the room panel.</p>
  <div class="track">
    <div class="lane"></div>
    <div class="finish"></div>
    <div class="car" id="car">🏎️</div>
  </div>
  <button type="button" id="go">START RACE</button>
  <div id="status"></div>
  <script>
    var busy = false;
    function post(o) {
      try {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify(o));
        }
      } catch (e) {}
    }

    document.getElementById("go").onclick = function () {
      if (busy) return;
      busy = true;
      this.disabled = true;
      var car = document.getElementById("car");
      car.style.left = "16px";
      document.getElementById("status").textContent = "Racing…";
      requestAnimationFrame(function () {
        car.style.left = "calc(100% - 56px)";
      });
      post({ type: "REQUEST_CHAMPCAR", v: 1 });
      setTimeout(function () {
        var win = Math.random() > 0.45;
        document.getElementById("status").textContent = win
          ? "Finish! Open Reddy to place a color bet."
          : "Close race — try again or open Reddy.";
        busy = false;
        document.getElementById("go").disabled = false;
        post({ type: "CHAMPCAR_COMPLETE", openReddy: true, win: win });
      }, 1300);
    };
    post({ type: "GAME_READY", game: "champcar" });
  </script>
</body>
</html>
