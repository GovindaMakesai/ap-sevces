<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Greedy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(180deg, #7c2d12, #1c1917);
      color: #ffedd5; font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 20px 16px;
      touch-action: manipulation;
    }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    p { font-size: 0.85rem; opacity: 0.9; text-align: center; max-width: 320px; margin: 0; }
    .hud {
      display: flex; gap: 16px; margin: 18px 0 8px; font-weight: 800; font-size: 0.95rem;
    }
    .hud span { background: rgba(0,0,0,0.28); padding: 8px 14px; border-radius: 999px; }
    .board {
      width: 100%; max-width: 340px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin: 16px 0;
    }
    .cell {
      aspect-ratio: 1; border: none; border-radius: 16px;
      background: linear-gradient(160deg, #fb923c, #ea580c);
      color: #fff; font-size: 2rem; font-weight: 900;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
      transition: transform 0.12s ease, filter 0.2s;
    }
    .cell:active { transform: scale(0.94); }
    .cell.is-pick { outline: 3px solid #fde68a; filter: brightness(1.15); }
    .cell.is-win { animation: pop 0.45s ease; background: linear-gradient(160deg, #facc15, #eab308); color: #422006; }
    .cell.is-lose { filter: grayscale(0.6) brightness(0.7); }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button.primary, button.ghost {
      border: none; padding: 14px 22px; border-radius: 14px; font-weight: 900; font-size: 0.95rem;
    }
    button.primary { background: #fbbf24; color: #422006; }
    button.ghost { background: rgba(255,255,255,0.12); color: #ffedd5; }
    button:disabled { opacity: 0.45; }
    #status { margin-top: 16px; text-align: center; min-height: 48px; font-weight: 800; }
  </style>
</head>
<body>
  <h1>💎 Greedy</h1>
  <p>Pick a gem. Match the secret prize gem to multiply — miss and bust. Local demo.</p>
  <div class="hud">
    <span>Bank: <strong id="bank">100</strong></span>
    <span>Bet: <strong id="betLabel">10</strong></span>
  </div>
  <div class="board" id="board"></div>
  <div class="actions">
    <button type="button" class="ghost" id="betDown">− Bet</button>
    <button type="button" class="ghost" id="betUp">+ Bet</button>
    <button type="button" class="primary" id="play">PLAY</button>
  </div>
  <div id="status">Tap PLAY, then choose a gem.</div>
  <script>
    var GEMS = ["💎", "👑", "🔮", "🪙", "🎁", "⭐", "🔥", "🍀", "🧿"];
    var bank = 100;
    var bet = 10;
    var busy = false;
    var awaitingPick = false;
    var prizeIndex = -1;

    function post(o) {
      try {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify(o));
        }
      } catch (e) {}
    }

    function paintHud() {
      document.getElementById("bank").textContent = String(bank);
      document.getElementById("betLabel").textContent = String(bet);
    }

    function renderBoard(state) {
      var board = document.getElementById("board");
      board.innerHTML = "";
      GEMS.forEach(function (g, i) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cell";
        btn.textContent = g;
        btn.dataset.i = String(i);
        if (state && state.pick === i) btn.classList.add("is-pick");
        if (state && state.reveal) {
          if (i === prizeIndex) btn.classList.add("is-win");
          else if (state.pick === i) btn.classList.add("is-lose");
        }
        btn.onclick = function () { onPick(i); };
        board.appendChild(btn);
      });
    }

    function onPick(i) {
      if (!awaitingPick || busy) return;
      busy = true;
      awaitingPick = false;
      var win = i === prizeIndex;
      var payout = win ? bet * 3 : 0;
      if (win) bank += payout;
      renderBoard({ pick: i, reveal: true });
      document.getElementById("status").textContent = win
        ? "Jackpot! +" + payout + " coins"
        : "Bust — lost " + bet + ". Prize was " + GEMS[prizeIndex];
      paintHud();
      post({ type: "GREEDY_RESULT", win: win, bet: bet, payout: payout, bank: bank, pick: i, prize: prizeIndex });
      document.getElementById("play").disabled = false;
      busy = false;
    }

    document.getElementById("betDown").onclick = function () {
      if (awaitingPick || busy) return;
      bet = Math.max(5, bet - 5);
      paintHud();
    };
    document.getElementById("betUp").onclick = function () {
      if (awaitingPick || busy) return;
      bet = Math.min(50, bet + 5);
      paintHud();
    };
    document.getElementById("play").onclick = function () {
      if (busy || awaitingPick) return;
      if (bank < bet) {
        document.getElementById("status").textContent = "Not enough bank — lower bet.";
        return;
      }
      bank -= bet;
      prizeIndex = Math.floor(Math.random() * GEMS.length);
      awaitingPick = true;
      paintHud();
      renderBoard();
      document.getElementById("status").textContent = "Choose a gem!";
      this.disabled = true;
      post({ type: "REQUEST_GREEDY", bet: bet });
    };

    paintHud();
    renderBoard();
    post({ type: "GAME_READY", game: "greedy" });
  </script>
</body>
</html>
