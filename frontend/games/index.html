<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Room Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      color: #e2e8f0; font-family: system-ui, sans-serif;
      padding: 20px 16px 40px; touch-action: manipulation;
    }
    h1 { font-size: 1.35rem; text-align: center; margin: 0 0 8px; }
    p { text-align: center; opacity: 0.85; font-size: 0.85rem; max-width: 340px; margin: 0 auto 20px; }
    .grid {
      display: grid; grid-template-columns: 1fr; gap: 12px;
      max-width: 420px; margin: 0 auto;
    }
    a.game {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; min-height: 110px; padding: 16px 10px; border-radius: 18px;
      text-decoration: none; color: inherit; font-weight: 900;
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    }
    a.game span { font-size: 1.8rem; }
    a.game small { font-weight: 600; opacity: 0.85; font-size: 0.72rem; text-align: center; }
    .crazyFruit { background: linear-gradient(160deg, #f59e0b, #b45309); }
    .greedy { background: linear-gradient(160deg, #7c3aed, #4c1d95); }
    .teenpatti { background: linear-gradient(160deg, #8b5cf6, #4c1d95); }
  </style>
</head>
<body>
  <h1>🎮 Room Games</h1>
  <p>Play these inside live/party rooms via Basic Tools → Games, or preview standalone below.</p>
  <div class="grid">
    <a class="game crazyFruit" href="/games/crazy-fruit.html"><span>🍒</span>Crazy Fruit<small>Slot machine spin</small></a>
    <a class="game greedy" href="/games/greedy.html"><span>💎</span>Krazy Khazana<small>Greedy gem wheel</small></a>
    <a class="game teenpatti" href="/games/teen-patti.html"><span>👑</span>Teen Patti<small>King vs Queen · Royal Battle</small></a>
  </div>
  <script>
    try {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: "GAME_READY", game: "hub" }));
      }
    } catch (e) {}
  </script>
</body>
</html>
