<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f9a8d4">
  <title>CP Home - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #ffc8dd; min-height: 100dvh; }
    .cp-header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
      color: #fff;
    }
    .cp-header h1 { flex: 1; text-align: center; font-size: 17px; margin: 0; }
    .cp-back, .cp-help {
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: rgba(0,0,0,0.2); color: #fff; font-size: 16px;
    }
    .cp-days-pill {
      margin: 0 auto 12px; display: block; width: fit-content;
      padding: 8px 16px; border-radius: 999px;
      background: rgba(0,0,0,0.35); color: #fff; font-size: 13px;
    }
    .cp-couple {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 16px 20px;
    }
    .cp-avatar-wrap { text-align: center; color: #fff; font-size: 12px; max-width: 100px; }
    .cp-avatar {
      width: 72px; height: 72px; border-radius: 50%; border: 3px solid #fff;
      object-fit: cover; background: #ddd;
    }
    .cp-ring-link {
      width: 56px; height: 56px; border-radius: 50%;
      background: radial-gradient(circle, #86efac, #22c55e);
      border: 3px solid #fff; display: flex; align-items: center; justify-content: center;
      font-size: 28px; box-shadow: 0 4px 16px rgba(34,197,94,0.4); cursor: pointer;
    }
    .cp-scene {
      min-height: 55vh;
      background: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80') center bottom/cover no-repeat;
      border-radius: 24px 24px 0 0;
      margin-top: 8px;
    }
    .cp-empty {
      text-align: center; padding: 24px 16px; color: #831843;
    }
    .cp-empty a { color: #db2777; font-weight: 700; }
    .cp-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px;
    }
    .cp-modal.open { display: flex; }
    .cp-modal-box {
      background: #fff; border-radius: 16px; padding: 20px; width: min(320px, 100%);
      text-align: center;
    }
    .cp-modal-box h3 { margin: 0 0 8px; }
    .cp-modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .cp-modal-actions button {
      flex: 1; padding: 12px; border: none; border-radius: 999px; font-weight: 700; cursor: pointer;
    }
    .cp-btn-grey { background: #f3f4f6; color: #374151; }
    .cp-btn-teal { background: #14b8a6; color: #fff; }
    .cp-invite-card {
      margin: 12px 16px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.85);
    }
  </style>
</head>
<body>
  <header class="cp-header">
    <button type="button" class="cp-back" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
    <h1>CP Home</h1>
    <a href="/cp-tips.html?app=1" class="cp-help" aria-label="Tips"><i class="fas fa-question"></i></a>
  </header>

  <div id="cpContent">
    <span class="cp-days-pill" id="cpDaysPill" hidden>We have been CP for 0 days</span>
    <div class="cp-couple" id="cpCouple" hidden>
      <div class="cp-avatar-wrap">
        <img class="cp-avatar" id="cpMeAvatar" alt="">
        <div id="cpMeName">You</div>
      </div>
      <button type="button" class="cp-ring-link" id="cpRingBtn" aria-label="Ring">💍</button>
      <div class="cp-avatar-wrap">
        <img class="cp-avatar" id="cpPartnerAvatar" alt="">
        <div id="cpPartnerName">Partner</div>
      </div>
    </div>
    <div class="cp-empty" id="cpEmpty">
      <p>No CP partner yet.</p>
      <p>Reach <strong>2,000</strong> support points with someone, or accept a CP invitation to unlock CP Home.</p>
      <p><a href="/store.html?cat=rings&app=1">Buy a ring in Store</a> · <a href="/cp-tips.html?app=1">How CP works</a></p>
    </div>
    <div id="cpInviteList"></div>
    <div class="cp-scene" aria-hidden="true"></div>
  </div>

  <div class="cp-modal" id="cpRingModal">
    <div class="cp-modal-box">
      <div style="font-size:48px;margin-bottom:8px" id="cpModalRingEmoji">💍</div>
      <p>You want to</p>
      <div class="cp-modal-actions">
        <button type="button" class="cp-btn-grey" id="cpTakeOffBtn">Take off the ring</button>
        <button type="button" class="cp-btn-teal" id="cpChangeRingBtn">Change the ring</button>
      </div>
      <button type="button" style="margin-top:12px;border:none;background:none;color:#6b7280" id="cpModalClose">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="social-shell.js"></script>
  <script>
    async function cpFetch(path, opts = {}) {
      const token = localStorage.getItem('token');
      const res = await fetch(joinApiUrl('/cp' + path), {
        credentials: 'include',
        headers: {
          Accept: 'application/json',
          ...(token ? { Authorization: 'Bearer ' + token } : {}),
          ...(opts.headers || {}),
        },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || 'Request failed');
      return data.data;
    }

    function avatarUrl(name, pic) {
      if (pic && SocialShell?.getImageUrl) return SocialShell.getImageUrl(pic);
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'U')}&background=ec4899&color=fff`;
    }

    async function loadCpHome() {
      const data = await cpFetch('/home');
      const cp = data.cp;
      const pending = data.pendingInvites || [];

      const list = document.getElementById('cpInviteList');
      list.innerHTML = pending.map((inv) => `
        <div class="cp-invite-card">
          <strong>${inv.fromName}</strong> sent a CP invite (${inv.ring?.name || 'Ring'})
          <div style="margin-top:8px;display:flex;gap:8px">
            <button type="button" onclick="respondInvite('${inv.id}', true)" style="flex:1;padding:8px;border:none;border-radius:999px;background:#14b8a6;color:#fff">Accept</button>
            <button type="button" onclick="respondInvite('${inv.id}', false)" style="flex:1;padding:8px;border:none;border-radius:999px;background:#f3f4f6">Decline</button>
          </div>
        </div>`).join('');

      if (!cp) {
        document.getElementById('cpEmpty').hidden = false;
        document.getElementById('cpCouple').hidden = true;
        document.getElementById('cpDaysPill').hidden = true;
        return;
      }

      document.getElementById('cpEmpty').hidden = true;
      document.getElementById('cpCouple').hidden = false;
      document.getElementById('cpDaysPill').hidden = false;
      document.getElementById('cpDaysPill').textContent = `We have been CP for ${cp.daysTogether} days`;
      document.getElementById('cpPartnerName').textContent = cp.partnerName;
      document.getElementById('cpPartnerAvatar').src = avatarUrl(cp.partnerName, cp.partnerPic);
      document.getElementById('cpRingBtn').textContent = cp.ring?.emoji || '💍';

      try {
        const me = await API.get('/auth/me');
        const u = me.data?.user || me.data || me.user || me;
        const myName = `${u.first_name || ''} ${u.last_name || ''}`.trim() || 'You';
        document.getElementById('cpMeName').textContent = myName;
        document.getElementById('cpMeAvatar').src = avatarUrl(myName, u.profile_pic);
        document.getElementById('cpMeAvatar').onerror = function () {
          this.onerror = null;
          this.src = avatarUrl(myName, null);
        };
        document.getElementById('cpPartnerAvatar').onerror = function () {
          this.onerror = null;
          this.src = avatarUrl(cp.partnerName, null);
        };
      } catch (_e) {}
    }

    window.respondInvite = async (id, accept) => {
      try {
        await cpFetch('/invite/' + id + '/respond', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accept }),
        });
        loadCpHome();
      } catch (e) { alert(e.message); }
    };

    document.getElementById('cpRingBtn')?.addEventListener('click', () => {
      document.getElementById('cpRingModal').classList.add('open');
    });
    document.getElementById('cpModalClose')?.addEventListener('click', () => {
      document.getElementById('cpRingModal').classList.remove('open');
    });
    document.getElementById('cpTakeOffBtn')?.addEventListener('click', async () => {
      if (!confirm('Break up with your CP partner?')) return;
      try {
        await cpFetch('/break', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        document.getElementById('cpRingModal').classList.remove('open');
        loadCpHome();
      } catch (e) { alert(e.message); }
    });
    document.getElementById('cpChangeRingBtn')?.addEventListener('click', () => {
      location.href = '/store.html?cat=rings&app=1';
    });

    document.addEventListener('DOMContentLoaded', () => {
      SocialShell?.initPage?.({ activeNav: 'profile' });
      loadCpHome().catch((e) => {
        document.getElementById('cpEmpty').innerHTML = `<p>${e.message || 'Sign in to view CP Home'}</p>`;
      });
    });
  </script>
</body>
</html>
