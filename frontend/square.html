<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9a227">
  <title>Square - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css?v=20260730-creator">
  <link rel="stylesheet" href="social-features.css?v=20260730-creator">
</head>
<body class="social-tabs-page">
  <header class="social-top">
    <div class="social-main-tabs">
      <a href="/explore.html?tab=following&app=1">Following</a>
      <a href="/video.html?app=1">Video</a>
      <a href="/square.html?app=1" class="active">Square</a>
      <a href="/topics.html?app=1">Topics</a>
      <button type="button" class="social-icon-btn" data-social-camera style="margin-left:auto;border:none;background:#fffdf8"><i class="fas fa-camera"></i></button>
    </div>
    <div class="social-feed-scope" id="squareFeedScope" role="tablist" aria-label="Feed">
      <button type="button" class="social-feed-scope-btn is-active" data-feed="for_you">For You</button>
      <button type="button" class="social-feed-scope-btn" data-feed="following">Following</button>
      <button type="button" class="social-feed-scope-btn" data-feed="latest">Latest</button>
    </div>
  </header>

  <div id="social-banner-slider"></div>

  <div class="social-post-feed" id="squareFeed"></div>
  <div id="social-bottom-nav-mount"></div>

  <script src="app.js?v=20260727-livefix"></script>
  <script src="social-wallet.js?v=20260714-dual-coins"></script>
  <script src="social-interactions.js?v=20260730-creator"></script>
  <script src="social-banner-slider.js?v=20260723-policy-full"></script>
  <script src="social-create-post.js?v=20260723-db-posts"></script>
  <script src="social-shell.js?v=20260727-navtap"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const scope = document.getElementById('squareFeedScope');
      const current = window.SocialInteractions?.currentFeedScope?.() || 'for_you';
      scope?.querySelectorAll('[data-feed]').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.feed === current);
        btn.addEventListener('click', async () => {
          const next = SocialInteractions.setFeedScope(btn.dataset.feed);
          scope.querySelectorAll('[data-feed]').forEach((b) => b.classList.toggle('is-active', b.dataset.feed === next));
          await SocialInteractions.renderSquareFeed('squareFeed', { feed: next });
        });
      });
      SocialShell.initPage({ activeNav: 'video', squareFeed: true });
    });
  </script>
</body>
</html>
