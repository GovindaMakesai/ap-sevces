<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9a227">
  <title>Square - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css?v=20260802-square-sticky">
  <link rel="stylesheet" href="social-features.css?v=20260821-aspect">
  <link rel="stylesheet" href="social-creator-polish.css?v=20260802-thumb-fix3">
  <style>
    /* Square-only atmosphere — brighter gold theme, not flat dull cream */
    html.social-app body.social-square-page,
    body.social-square-page {
      --cream-bg: #fff6e4;
      --square-glow-a: rgba(245, 158, 11, 0.28);
      --square-glow-b: rgba(201, 162, 39, 0.22);
      --square-glow-c: rgba(255, 214, 102, 0.35);
      /* Main tabs + For You / Following / Latest — keep content below fixed header */
      --social-video-tabs-h: calc(102px + env(safe-area-inset-top, 0px));
      background-color: #fff6e4;
      background-image:
        radial-gradient(ellipse 90% 55% at 12% -8%, var(--square-glow-c) 0%, transparent 58%),
        radial-gradient(ellipse 70% 45% at 92% 6%, var(--square-glow-a) 0%, transparent 52%),
        radial-gradient(ellipse 60% 40% at 50% 28%, var(--square-glow-b) 0%, transparent 55%),
        radial-gradient(circle at 78% 72%, rgba(255, 186, 73, 0.14) 0%, transparent 42%),
        linear-gradient(180deg, #fff9eb 0%, #fff3d6 42%, #ffefc8 100%);
      background-attachment: fixed;
    }
    body.social-square-page .social-top {
      /* Keep above rails/feed — glow rule must not flatten header stacking */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background:
        linear-gradient(180deg, rgba(255, 250, 235, 0.96) 0%, rgba(255, 244, 214, 0.94) 100%);
      border-bottom-color: rgba(201, 162, 39, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    body.social-square-page .social-feed-scope {
      background: rgba(255, 253, 248, 0.55);
      border-radius: 14px;
      padding: 4px;
      margin-top: 4px;
    }
    body.social-square-page .social-feed-scope-btn.is-active {
      background: linear-gradient(135deg, #f0c14b, #c9a227);
      color: #3d2a08;
      box-shadow: 0 4px 14px rgba(201, 162, 39, 0.35);
    }
    body.social-square-page .ap-discover-rails {
      position: relative;
    }
    body.social-square-page .ap-discover-title {
      color: #6b4f10;
      text-shadow: 0 1px 0 rgba(255, 253, 248, 0.8);
    }
    body.social-square-page .ap-discover-card {
      background: linear-gradient(180deg, #fffef9 0%, #fff8e8 100%);
      border-color: rgba(201, 162, 39, 0.38);
      box-shadow: 0 8px 22px rgba(166, 124, 26, 0.12);
    }
    body.social-square-page .social-post-card {
      background: linear-gradient(180deg, #fffefb 0%, #fffaf0 100%);
      border: 1px solid rgba(201, 162, 39, 0.2);
      box-shadow: 0 10px 28px rgba(107, 79, 16, 0.1);
    }
    body.social-square-page .social-bottom-nav {
      background: linear-gradient(180deg, #fffdf6 0%, #fff6e0 100%);
      border-top-color: rgba(201, 162, 39, 0.28);
    }
    @media (prefers-reduced-motion: no-preference) {
      body.social-square-page::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(circle at 20% 15%, rgba(255, 220, 120, 0.22) 0%, transparent 36%),
          radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.12) 0%, transparent 32%);
        animation: ap-square-glow 14s ease-in-out infinite alternate;
      }
      /* Raise page content above the glow layer, but never the sticky header / bottom nav */
      body.social-square-page > *:not(.social-top):not(.social-bottom-nav):not(#social-bottom-nav-mount) {
        position: relative;
        z-index: 1;
      }
      @keyframes ap-square-glow {
        from { opacity: 0.55; transform: translate3d(0, 0, 0) scale(1); }
        to { opacity: 1; transform: translate3d(0, -1.5%, 0) scale(1.04); }
      }
    }
  </style>
</head>
<body class="social-tabs-page social-square-page">
  <header class="social-top">
    <div class="social-main-tabs">
      <a href="/explore.html?tab=following&app=1">Following</a>
      <a href="/video.html?app=1">Video</a>
      <a href="/square.html?app=1" class="active">Square</a>
      <button type="button" class="social-icon-btn" data-social-camera style="margin-left:auto;border:none;background:rgba(255,253,248,0.92)" aria-label="Create post"><i class="fas fa-camera"></i></button>
    </div>
    <div class="social-feed-scope" id="squareFeedScope" role="tablist" aria-label="Feed">
      <button type="button" class="social-feed-scope-btn is-active" data-feed="for_you" role="tab" aria-selected="true">For You</button>
      <button type="button" class="social-feed-scope-btn" data-feed="following" role="tab" aria-selected="false">Following</button>
      <button type="button" class="social-feed-scope-btn" data-feed="latest" role="tab" aria-selected="false">Latest</button>
    </div>
  </header>

  <div id="social-banner-slider"></div>
  <div id="social-discover-rails"></div>

  <div class="social-post-feed" id="squareFeed"></div>
  <div id="social-bottom-nav-mount"></div>

  <script src="app.js?v=20260730-fastnav2"></script>
  <script src="social-ui.js?v=20260802-thumb-fix3"></script>
  <script src="social-wallet.js?v=20260714-dual-coins" defer></script>
  <script src="social-creator-telemetry.js?v=20260730-stab1" defer></script>
  <script src="social-creator-polish.js?v=20260730-cx3" defer></script>
  <script src="social-creator-identity.js?v=20260730-cx2"></script>
  <script src="live-emoji-data.js?v=20260730-gifts" defer></script>
  <script src="social-fx.js?v=20260730-cx2" defer></script>
  <script src="social-discovery-rails.js?v=20260802-thumb-fix3" defer></script>
  <script src="social-interactions.js?v=20260821-aspect"></script>
  <script src="social-banner-slider.js?v=20260723-policy-full" defer></script>
  <script src="social-create-post.js?v=20260821-aspect" defer></script>
  <script src="ap-soft-nav.js?v=20260730-fastnav4"></script>
  <script src="social-shell.js?v=20260730-fastnav4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const scope = document.getElementById('squareFeedScope');
      const current = window.SocialInteractions?.currentFeedScope?.() || 'for_you';
      scope?.querySelectorAll('[data-feed]').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.feed === current);
        btn.setAttribute('aria-selected', btn.dataset.feed === current ? 'true' : 'false');
        btn.addEventListener('click', async () => {
          const next = SocialInteractions.setFeedScope(btn.dataset.feed);
          scope.querySelectorAll('[data-feed]').forEach((b) => {
            b.classList.toggle('is-active', b.dataset.feed === next);
            b.setAttribute('aria-selected', b.dataset.feed === next ? 'true' : 'false');
          });
          window.SocialCreatorPolish?.haptic?.('light');
          await SocialInteractions.renderSquareFeed('squareFeed', { feed: next });
        });
      });
      if (window.SocialDiscoveryRails) {
        SocialDiscoveryRails.mount('social-discover-rails').catch(() => {});
      }
      SocialShell.initPage({ activeNav: 'video', squareFeed: true });
    });
  </script>
</body>
</html>
