<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9a227">
  <title>Square - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
</head>
<body>
  <header class="social-top">
    <div class="social-main-tabs">
      <a href="/explore.html?tab=following">Following</a>
      <a href="/video.html">Video</a>
      <a href="/square.html" class="active">Square</a>
      <a href="/topics.html">Topics</a>
      <a href="/video.html" class="social-icon-btn" style="margin-left:auto"><i class="fas fa-camera"></i></a>
    </div>
    <div class="social-search">
      <i class="fas fa-search"></i>
      <input type="search" data-social-search placeholder="Search services">
    </div>
  </header>

  <section class="social-banner-wrap">
    <div class="social-banner" style="min-height:100px;background:linear-gradient(90deg,#fbbf24,#f59e0b)">
      <div class="social-banner-content">
        <h2>Discover Local Pros</h2>
        <p>Book trusted services near you</p>
      </div>
    </div>
  </section>

  <div class="social-grid" id="squareGrid"></div>
  <div id="social-bottom-nav-mount"></div>

  <script src="app.js"></script>
  <script src="social-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialShell.initPage({ activeNav: 'explore', gridId: 'squareGrid', gridLimit: 12 });
    });
  </script>
</body>
</html>
