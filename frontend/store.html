<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8b5cf6">
  <title>Store - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="cp-rings.css?v=20260814-cpflow3">
</head>
<body class="social-store-page">
  <header class="social-store-header">
    <a href="/explore.html" class="social-icon-btn" style="background:#f3f4f6;color:#374151"><i class="fas fa-arrow-left"></i></a>
    <h1>Store</h1>
    <a href="/rankings.html" class="social-icon-btn" style="background:#fef3c7;color:#b45309"><i class="fas fa-trophy"></i></a>
  </header>

  <div class="social-cat-scroll">
    <a href="/store.html" class="social-cat-item active"><span class="icon-wrap">🔥</span>Popular</a>
    <a href="/vip.html" class="social-cat-item"><span class="icon-wrap">🛡️</span>Honor</a>
    <a href="/store.html?cat=ride" class="social-cat-item"><span class="icon-wrap">🚗</span>Ride</a>
    <a href="/store.html?cat=frame" class="social-cat-item"><span class="icon-wrap">🖼️</span>Avatar Frame</a>
    <a href="/store.html?cat=rings" class="social-cat-item"><span class="icon-wrap">💍</span>Rings</a>
    <a href="/store.html?cat=bubble" class="social-cat-item"><span class="icon-wrap">💬</span>Chat Bubble</a>
    <a href="/services.html" class="social-cat-item"><span class="icon-wrap"><i class="fas fa-list"></i></span>Services</a>
  </div>

  <div style="padding:0 12px 12px">
    <div class="social-banner" style="min-height:90px;background:linear-gradient(90deg,#fbbf24,#f59e0b)">
      <div class="social-banner-content"><h2 style="font-size:18px">Create Your Exclusive Ride</h2></div>
    </div>
  </div>

  <h3 style="padding:8px 16px;font-size:15px;color:#374151">New This Month</h3>
  <div class="social-store-grid" id="storeGridNew"></div>

  <h3 style="padding:16px 16px 8px;font-size:15px;color:#374151">Avatar Frame</h3>
  <div style="padding:0 12px 8px;display:flex;gap:8px">
    <button type="button" class="social-pill-tag" style="background:var(--purple-500);color:#fff;border:none">Hot Picks</button>
    <button type="button" class="social-pill-tag" style="background:#f3f4f6;border:none;color:#6b7280">Latest</button>
  </div>
  <div class="social-store-grid" id="storeGrid"></div>

  <div class="social-wallet-bar">
    <span>🪙 <strong id="coins">0</strong></span>
    <a href="/coins-recharge.html?app=1" style="background:linear-gradient(135deg,#e8c56a,#c9a227);color:#3d2e08;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800">+</a>
    <span style="margin-left:8px">🎫 <strong>0</strong></span>
    <a href="/coins-recharge.html?app=1" style="background:linear-gradient(135deg,#e8c56a,#c9a227);color:#3d2e08;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800">+</a>
    <a href="/points.html?app=1" style="margin-left:8px;font-size:12px;font-weight:700;color:#ec4899;text-decoration:none;padding:6px 10px;border:1px solid #f9a8d4;border-radius:999px">Withdraw</a>
    <a href="/customer-dashboard.html" style="margin-left:auto;font-size:22px;text-decoration:none" title="Bag">🎒</a>
  </div>

  <div id="social-bottom-nav-mount"></div>

  <div class="social-sheet-overlay" id="itemSheet">
    <div class="social-sheet">
      <h2 id="sheetTitle">Item</h2>
      <div style="text-align:center;padding:20px;background:#f0f9ff;border-radius:12px;margin-bottom:16px;font-size:64px" id="sheetEmoji">🚲</div>
      <p><strong>Validity Period:</strong> <span class="social-pill-tag">30 Days</span></p>
      <p style="margin:12px 0"><strong>Payment Method:</strong> 🪙 Coins</p>
      <p style="font-size:22px;font-weight:800;margin:16px 0" id="sheetPrice">18,000 🪙</p>
      <a href="/coins-recharge.html?app=1" class="social-btn-orange">Scan QR to Recharge</a>
      <button type="button" style="width:100%;margin-top:12px;padding:12px;border:none;background:#f3f4f6;border-radius:12px;cursor:pointer" onclick="document.getElementById('itemSheet').classList.remove('open')">Close</button>
    </div>
  </div>

  <script src="cp-rings.js?v=20260814-cpflow3"></script>
  <script src="app.js"></script>
  <script src="social-wallet.js"></script>
  <script src="social-shell.js"></script>
  <script>
    const ITEMS = [
      { name: 'Gold Solar Crown', emoji: '👑', price: '30', ticket: true },
      { name: 'Panther Frame', emoji: '🐆', price: '50,000' },
      { name: 'Eagle Frame', emoji: '🦅', price: '50' , ticket: true },
      { name: 'Toyota Ride', emoji: '🚗', price: '399,900' },
      { name: 'Panther Ride', emoji: '🐈‍⬛', price: '699,900' },
      { name: 'Christmas Car', emoji: '🎅', price: '399,900' },
      { name: 'Virgo Frame', emoji: '♍', price: '69,000' },
      { name: 'Cyberpunk', emoji: '🤖', price: '100' , ticket: true },
      { name: 'Bike', emoji: '🚲', price: '18,000' },
    ];
    function renderItem(it) {
      const pkg = it.packageId ? ` data-package-id="${it.packageId}"` : '';
      const img = it.ringId
        ? `<div class="img cp-ring-preview" data-ring-mount="${it.ringId}"></div>`
        : `<div class="img">${it.emoji}</div>`;
      return `<a class="social-store-item" href="#" data-name="${it.name}" data-emoji="${it.emoji}" data-price="${it.price}"${pkg}${it.ringId ? ` data-ring-id="${it.ringId}"` : ''}>
        ${img}
        <h4>${it.name}</h4>
        <div class="price">${it.ticket ? '🎫' : '🪙'} ${it.price}</div>
      </a>`;
    }
    function paintSheetPreview(el, ringId, emoji) {
      const box = document.getElementById('sheetEmoji');
      if (!box) return;
      if (ringId && window.CpRings) {
        box.className = 'cp-ring-sheet-preview';
        box.removeAttribute('style');
        CpRings.mount(box, ringId, 'lg');
      } else {
        box.className = '';
        box.style.cssText = 'text-align:center;padding:20px;background:#f0f9ff;border-radius:12px;margin-bottom:16px;font-size:64px';
        box.textContent = emoji || '🪙';
      }
    }
    function mountRingPreviews(root) {
      (root || document).querySelectorAll('[data-ring-mount]').forEach((el) => {
        CpRings?.mount?.(el, el.dataset.ringMount, 'md');
      });
    }
    document.addEventListener('DOMContentLoaded', async () => {
      const cat = new URLSearchParams(location.search).get('cat');
      const coinsEl = document.getElementById('coins');
      if (coinsEl && window.SocialWallet) {
        const b = await SocialWallet.fetchBalance();
        coinsEl.textContent = String(b.coin_balance || 0);
      }
      SocialShell.initPage({ activeNav: 'explore' });
      document.querySelectorAll('.social-cat-item').forEach((a) => {
        a.classList.toggle('active', cat ? a.href.includes('cat=' + cat) : a.href.endsWith('/store.html'));
      });

      if (cat === 'rings') {
        document.querySelector('h1').textContent = 'Store';
        document.querySelector('.social-banner h2').textContent = 'Rhythm Party — CP Rings';
        document.querySelector('.social-cat-item[href*="cat=rings"]')?.classList.add('active');
        let rings = [];
        try {
          const token = localStorage.getItem('token');
          const res = await fetch(joinApiUrl('/cp/rings'), {
            credentials: 'include',
            headers: token ? { Authorization: 'Bearer ' + token, Accept: 'application/json' } : { Accept: 'application/json' },
          });
          const data = await res.json();
          if (data.success) rings = data.data;
        } catch (_e) {}
        const ringItems = rings.map((r) => ({
          name: r.name,
          emoji: r.emoji,
          price: Number(r.price).toLocaleString(),
          ringId: r.id,
          rawPrice: r.price,
        }));
        document.getElementById('storeGridNew').innerHTML = '';
        document.getElementById('storeGrid').innerHTML = ringItems.map(renderItem).join('');
        mountRingPreviews();
        const fromCp = new URLSearchParams(location.search).get('from') === 'cp';
        document.querySelectorAll('.social-store-item').forEach((el) => {
          el.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('sheetTitle').textContent = el.dataset.name;
            paintSheetPreview(el, el.dataset.ringId, el.dataset.emoji);
            document.getElementById('sheetPrice').textContent = el.dataset.price + ' 🪙';
            document.getElementById('itemSheet').classList.add('open');
            const buyBtn = document.getElementById('ringBuyBtn');
            if (buyBtn) {
              buyBtn.dataset.ringId = el.dataset.ringId || '';
              buyBtn.dataset.ringName = el.dataset.name || '';
            }
          });
        });
        let ringBuyBtn = document.getElementById('ringBuyBtn');
        if (!ringBuyBtn) {
          const sheet = document.querySelector('#itemSheet .social-sheet');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.id = 'ringBuyBtn';
          btn.className = 'social-btn-orange';
          btn.style.cssText = 'width:100%;margin-top:12px;border:none;cursor:pointer';
          btn.textContent = 'Buy';
          sheet?.insertBefore(btn, sheet.querySelector('button[onclick]'));
          ringBuyBtn = btn;
        }
        ringBuyBtn.textContent = 'Buy';
        ringBuyBtn.onclick = async () => {
          const ringId = ringBuyBtn.dataset.ringId;
          if (!ringId) return;
          ringBuyBtn.disabled = true;
          ringBuyBtn.textContent = 'Buying…';
          try {
            const token = localStorage.getItem('token');
            const res = await fetch(joinApiUrl('/cp/rings/purchase'), {
              method: 'POST',
              credentials: 'include',
              headers: {
                'Content-Type': 'application/json',
                ...(token ? { Authorization: 'Bearer ' + token } : {}),
              },
              body: JSON.stringify({ ringId }),
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.message);
            document.getElementById('itemSheet').classList.remove('open');
            alert('Ring added to your bag! You can now send a CP invitation.');
            if (SocialWallet) {
              const b = await SocialWallet.fetchBalance();
              coinsEl.textContent = String(b.coin_balance || 0);
            }
            if (fromCp) location.href = '/cp-home.html?app=1';
          } catch (err) {
            alert(err.message || 'Purchase failed');
          } finally {
            ringBuyBtn.disabled = false;
            ringBuyBtn.textContent = 'Buy';
          }
        };
        if (fromCp && ringItems.length) {
          document.querySelector('.social-store-item')?.click();
        }
        return;
      }

      let packages = [];
      try {
        const res = await fetch((CONFIG.API_URL || '/api') + '/store/packages', { credentials: 'include' });
        const data = await res.json();
        if (data.success) packages = data.data;
      } catch (_e) {}
      const items = packages.length
        ? packages.map((p) => ({
            name: p.name,
            emoji: '🪙',
            price: String(p.coins + (p.bonus_coins || 0)),
            packageId: p.id,
            inr: p.price_inr,
          }))
        : ITEMS;
      document.getElementById('storeGridNew').innerHTML = items.slice(0, 3).map(renderItem).join('');
      document.getElementById('storeGrid').innerHTML = items.map(renderItem).join('');
      document.querySelectorAll('.social-store-item').forEach((el) => {
        el.addEventListener('click', async (e) => {
          e.preventDefault();
          document.getElementById('sheetTitle').textContent = el.dataset.name;
          document.getElementById('sheetEmoji').textContent = el.dataset.emoji;
          document.getElementById('sheetPrice').textContent = el.dataset.price + ' 🪙';
          document.getElementById('itemSheet').classList.add('open');
          const buyBtn = document.querySelector('#itemSheet .social-btn-orange');
          if (buyBtn) {
            const amount = parseInt(el.dataset.inr || '', 10);
            buyBtn.textContent = 'Scan QR to Recharge';
            buyBtn.onclick = (ev) => {
              ev.preventDefault();
              const qs = Number.isFinite(amount) && amount > 0 ? `&amount=${encodeURIComponent(String(amount))}` : '';
              location.href = `/coins-recharge.html?app=1${qs}`;
            };
          }
        });
      });
      document.getElementById('itemSheet').addEventListener('click', (e) => {
        if (e.target.id === 'itemSheet') e.target.classList.remove('open');
      });
    });
  </script>
</body>
</html>
