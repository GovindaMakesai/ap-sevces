<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <title>Visitors - AP Services</title>
  <script src="ap-native-boot.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="visitors.css?v=20260814-visitors">
</head>
<body class="visitors-page">
  <header class="visitors-header">
    <button type="button" class="visitors-back" onclick="history.back()" aria-label="Back"><i class="fas fa-chevron-left"></i></button>
    <h1>Visitors</h1>
    <span style="width:36px"></span>
  </header>

  <div id="visitorsRoot">
    <div class="visitors-loading">Loading…</div>
  </div>

  <div id="social-bottom-nav-mount"></div>

  <script src="ap-config.js"></script>
  <script src="app.js"></script>
  <script src="social-shell.js"></script>
  <script>
    function authToken() {
      return localStorage.getItem('token') || localStorage.getItem('access_token') || (window.Auth?.getToken?.() || '');
    }

    function timeAgo(iso) {
      const d = new Date(iso);
      const sec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (sec < 60) return 'Just now';
      if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
      if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
      if (sec < 604800) return Math.floor(sec / 86400) + 'd ago';
      return d.toLocaleDateString();
    }

    function avatarUrl(name, pic) {
      if (pic && SocialShell?.getImageUrl) return SocialShell.getImageUrl(pic);
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'U')}&background=a855f7&color=fff`;
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function boot() {
      if (!authToken()) {
        location.href = '/login.html?redirect=' + encodeURIComponent('/visitors.html?app=1');
        return;
      }
      const root = document.getElementById('visitorsRoot');
      try {
        const headers = { Accept: 'application/json', Authorization: 'Bearer ' + authToken() };
        const [sumRes, listRes] = await Promise.all([
          fetch(joinApiUrl('/social/visitors/summary'), { credentials: 'include', headers }),
          fetch(joinApiUrl('/social/visitors'), { credentials: 'include', headers }),
        ]);
        const sumJson = await sumRes.json().catch(() => ({}));
        const listJson = await listRes.json().catch(() => ({}));
        if (!sumRes.ok) throw new Error(sumJson.message || 'Failed to load');
        const summary = sumJson.data || {};
        const list = listJson.data || {};

        if (!summary.canView) {
          root.innerHTML =
            `<div class="visitors-summary">` +
            `<strong>${summary.totalVisitors || 0}</strong>` +
            `<span>people visited your profile</span>` +
            `<small>Unlock the full visitor list with SVIP ${summary.svipRequired || 1}+.</small>` +
            `</div>` +
            `<div class="visitors-upsell">` +
            `<h2><i class="fas fa-users"></i> SVIP Visitors</h2>` +
            `<p>See who viewed your profile, when they visited, and how many times — an exclusive SVIP perk.</p>` +
            `<a href="/svip.html?app=1">Upgrade to SVIP</a>` +
            `</div>`;
          return;
        }

        const visitors = list.visitors || [];
        let html =
          `<div class="visitors-summary">` +
          `<strong>${summary.totalVisitors || 0}</strong>` +
          `<span>unique visitors · ${summary.totalVisits || 0} total views</span>` +
          `<small>${summary.weekVisitors || 0} visited in the last 7 days</small>` +
          `</div>`;

        if (!visitors.length) {
          html += `<div class="visitors-empty"><i class="fas fa-eye" style="font-size:32px;opacity:.35;display:block;margin-bottom:10px"></i>No visitors yet. Share your profile to get noticed!</div>`;
        } else {
          html += `<div class="visitors-list">` + visitors.map((v) => {
            const sub = `${timeAgo(v.visitedAt)}${v.visitCount > 1 ? ' · ' + v.visitCount + ' visits' : ''}`;
            const href = v.userId ? `/creator-profile.html?userId=${encodeURIComponent(v.userId)}&app=1` : '#';
            const avatar = v.isAnonymous
              ? `<div class="visitors-avatar-ph"><i class="fas fa-user-secret"></i></div>`
              : `<img src="${avatarUrl(v.name, v.profilePic)}" alt="" loading="lazy">`;
            const badge = v.visitCount > 1 ? `<span class="visitors-count-badge">${v.visitCount}×</span>` : '';
            return (
              `<a class="visitors-row" href="${href}">` +
              avatar +
              `<div class="visitors-meta"><strong>${esc(v.name)}</strong><span>${esc(sub)}</span></div>` +
              badge +
              `</a>`
            );
          }).join('') + `</div>`;
        }
        root.innerHTML = html;
        SocialUI?.bindAvatarFallbacks?.(root);
      } catch (err) {
        root.innerHTML = `<div class="visitors-empty">${esc(err.message || 'Could not load visitors')}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      SocialShell?.initPage?.({ activeNav: 'profile' });
      boot();
    });
  </script>
</body>
</html>
