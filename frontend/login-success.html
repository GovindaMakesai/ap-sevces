<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Signing You In - AP Services</title>
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="social-auth.css">
  <script src="social-auth-init.js"></script>
</head>
<body class="auth-success-page">
  <div class="auth-success-card" id="card">
    <div class="auth-success-spinner" id="spinner"></div>
    <h2 id="title">Signing you in</h2>
    <p id="statusText">Please wait…</p>
    <a href="/app-auth.html?app=1" class="auth-success-back" id="backBtn" style="display:none">Back to Welcome</a>
  </div>

  <script src="ap-config.js"></script>
  <script src="app.js"></script>
  <script>
    (async function completeOAuthLogin() {
      const statusText = document.getElementById('statusText');
      const title = document.getElementById('title');
      const card = document.getElementById('card');
      const spinner = document.getElementById('spinner');
      const backBtn = document.getElementById('backBtn');
      const params = new URLSearchParams(window.location.search);
      const inNativeApp =
        Boolean(window.ReactNativeWebView) ||
        Boolean(window.__AP_NATIVE_APP__) ||
        params.get('source') === 'expo-app' ||
        params.get('app') === '1';

      function showError(msg) {
        spinner.style.display = 'none';
        card.classList.add('is-error');
        title.textContent = 'Sign in issue';
        statusText.textContent = msg;
        backBtn.style.display = 'inline-block';
      }

      function enterApp(user) {
        if (window.AppAuth && typeof AppAuth.completeLoginAndEnterApp === 'function') {
          AppAuth.completeLoginAndEnterApp(user);
          return;
        }
        const q = inNativeApp ? '?app=1' : '';
        if (user && user.role === 'admin') window.location.replace('/admin-dashboard.html' + q);
        else if (user && user.role === 'worker') window.location.replace('/worker-dashboard.html' + q);
        else window.location.replace('/explore.html' + q);
      }

      const exchangeCode = params.get('code');
      const oauthCookieFlow = params.get('oauth') === '1';

      try {
        if (exchangeCode) {
          statusText.textContent = 'Completing secure sign in…';
          const apiBase = (window.CONFIG && CONFIG.API_URL) || 'https://api.apservices.in/api';
          const res = await fetch(apiBase.replace(/\/$/, '') + '/auth/exchange-code', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: exchangeCode }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.success) throw new Error(data.message || 'Exchange failed');
          if (window.Auth?.storeSessionTokens) {
            Auth.storeSessionTokens(data.data);
          } else {
            localStorage.setItem('user', JSON.stringify(data.data.user));
            if (data.data.accessToken) localStorage.setItem('token', data.data.accessToken);
            if (data.data.refreshToken) localStorage.setItem('ap_refresh_token', data.data.refreshToken);
          }
          if (window.AppState) AppState.user = data.data.user;
          enterApp(data.data.user);
          return;
        }

        if (oauthCookieFlow || params.get('token')) {
          statusText.textContent = 'Loading your profile…';
          const urlToken = params.get('token');
          if (urlToken) {
            try {
              localStorage.setItem('token', urlToken);
            } catch (_e) {
              /* ignore */
            }
          }
          const user = (await Auth.refreshSession()) ? Auth.getUser() : null;
          if (user) {
            localStorage.removeItem('token');
            enterApp(user);
            return;
          }
        }

        const ok = await Auth.refreshSession();
        if (ok) {
          enterApp(Auth.getUser());
          return;
        }
        showError('We could not verify your session. Please try signing in again.');
        setTimeout(() => window.location.replace('/app-auth.html?app=1'), 2800);
      } catch (err) {
        console.error('[login-success]', err);
        showError(err.message || 'Sign in failed');
      }
    })();
  </script>
</body>
</html>
