<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing You In...</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
        <h2>Signing you in...</h2>
        <p id="statusText">Please wait while we complete login.</p>
    </div>

    <script src="app.js"></script>
    <script>
        (async function completeOAuthLogin() {
            const statusText = document.getElementById('statusText');
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                statusText.textContent = 'Missing login token. Redirecting to login.';
                setTimeout(() => { window.location.replace('/login.html'); }, 1200);
                return;
            }

            localStorage.setItem('token', token);

            const inExpoApp = Boolean(window.ReactNativeWebView) || params.get('source') === 'expo-app';

            async function loadUserAndGoDashboard() {
                if (window.Auth && typeof Auth.refreshSession === 'function') {
                    const ok = await Auth.refreshSession();
                    if (ok) return Auth.getUser();
                }
                const apiBase = (window.CONFIG && CONFIG.API_URL) || 'https://ap-sevces.onrender.com/api';
                const res = await fetch(apiBase + '/auth/me', {
                    headers: { Authorization: 'Bearer ' + token }
                });
                const data = await res.json();
                if (!res.ok || !data.success || !data.data?.user) {
                    throw new Error(data.message || 'Could not load profile');
                }
                localStorage.setItem('user', JSON.stringify(data.data.user));
                if (window.AppState) AppState.user = data.data.user;
                return data.data.user;
            }

            function goDashboard(user) {
                if (user.role === 'admin') {
                    window.location.replace('/admin-dashboard.html');
                } else if (user.role === 'worker') {
                    window.location.replace('/worker-dashboard.html');
                } else {
                    window.location.replace('/customer-dashboard.html');
                }
            }

            if (inExpoApp) {
                statusText.textContent = 'Opening your dashboard...';
                try {
                    const user = await loadUserAndGoDashboard();
                    goDashboard(user);
                } catch (error) {
                    console.error('Expo login-success:', error);
                    statusText.textContent = 'Login failed. Redirecting to login...';
                    setTimeout(() => { window.location.replace('/login.html'); }, 1400);
                }
                return;
            }

            const appRedirect = params.get('app_redirect') || localStorage.getItem('app_redirect') || '';

            if (appRedirect && /^(apservices|exp):\/\//i.test(appRedirect)) {
                statusText.textContent = 'Returning to app...';
                const separator = appRedirect.includes('?') ? '&' : '?';
                const deepLink = appRedirect + separator + 'token=' + encodeURIComponent(token);
                // Let the native auth session read this HTTPS URL and close first.
                setTimeout(function () {
                    window.location.replace(deepLink);
                }, 1200);
                setTimeout(function () {
                    statusText.textContent = 'Close this tab, then open AP Services on your phone.';
                }, 3500);
                return;
            }

            statusText.textContent = 'Finishing sign-in...';
            try {
                if (window.Auth && typeof Auth.refreshSession === 'function') {
                    const ok = await Auth.refreshSession();
                    if (!ok) throw new Error('Session refresh failed');
                }
                const userRaw = localStorage.getItem('user');
                const user = userRaw ? JSON.parse(userRaw) : null;
                if (!user) throw new Error('User profile unavailable');
                if (user.role === 'admin') {
                    window.location.replace('/admin-dashboard.html');
                } else if (user.role === 'worker') {
                    window.location.replace('/worker-dashboard.html');
                } else {
                    window.location.replace('/customer-dashboard.html');
                }
            } catch (error) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                statusText.textContent = 'Login failed. Redirecting to login.';
                setTimeout(() => { window.location.replace('/login.html'); }, 1400);
            }
        })();
    </script>
</body>
</html>
