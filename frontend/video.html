<!DOCTYPE html>
<html lang="en" class="social-video-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Video - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="social-features.css">
</head>
<body class="social-video-page">
  <header class="social-video-top">
    <div class="social-main-tabs">
      <a href="/explore.html?tab=following&app=1">Following</a>
      <a href="/video.html?app=1" class="active">Video</a>
      <a href="/square.html?app=1">Square</a>
      <a href="/topics.html?app=1">Topics</a>
      <button type="button" class="social-icon-btn" data-social-camera style="margin-left:auto;background:rgba(255,255,255,0.2);color:#fff;border:none"><i class="fas fa-camera"></i></button>
    </div>
  </header>

  <div id="reelsMount" class="social-reels-wrap"></div>

  <div class="social-video-actions" id="reelActions">
    <div class="social-video-action-item">
      <button type="button" data-action="like" aria-label="Like"><i class="fas fa-heart"></i></button>
      <div class="count" id="likeCount">0</div>
    </div>
    <div class="social-video-action-item">
      <button type="button" data-action="comment" aria-label="Comment"><i class="fas fa-comment"></i></button>
      <div class="count">0</div>
    </div>
    <div class="social-video-action-item">
      <button type="button" data-action="gift" class="gift-btn" aria-label="Gift"><i class="fas fa-gift"></i></button>
      <div class="count">0</div>
    </div>
    <div class="social-video-action-item">
      <button type="button" data-action="share" aria-label="Share"><i class="fas fa-paper-plane"></i></button>
      <div class="count">0</div>
    </div>
  </div>

  <div class="social-video-user" id="reelUserBar">
    <img id="videoAvatar" src="" alt="" role="button" tabindex="0">
    <div>
      <div class="name" id="videoName">Creator</div>
      <div class="video-caption" id="videoCaption">Follow ❤️🔥</div>
    </div>
    <button type="button" class="follow-btn" id="followBtn">Follow</button>
  </div>

  <div id="social-bottom-nav-mount"></div>

  <script src="app.js"></script>
  <script src="social-interactions.js"></script>
  <script src="social-create-post.js"></script>
  <script src="social-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      SocialShell.initPage({ activeNav: 'video', reelsId: null });
      await SocialInteractions.initVideoPage('reelsMount');
      SocialCreatePost.bindCameraButtons();
    });
  </script>
</body>
</html>
