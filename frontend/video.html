<!DOCTYPE html>
<html lang="en" class="social-video-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <title>Video - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
  <link rel="stylesheet" href="social-theme.css?v=20260730-reelui">
  <link rel="stylesheet" href="social-features.css?v=20260802-post-delete">
  <link rel="stylesheet" href="social-creator-polish.css?v=20260802-thumb-fix3">
  <link rel="stylesheet" href="social-fx.css?v=20260730-cx2">
  <style>
    .social-video-page .social-video-top {
      background: var(--social-cream, #fdf9f0);
      box-shadow: 0 1px 0 rgba(107, 79, 16, 0.08);
    }
    .social-video-page .social-video-top .social-main-tabs a,
    .social-video-page .social-video-top .social-main-tabs button {
      color: var(--gold-600, #a16207);
    }
    .social-video-page .social-video-top .social-main-tabs a.active,
    .social-video-page .social-video-top .social-main-tabs button.active {
      color: var(--gold-800, #6b4f10);
    }
    .social-video-page .social-video-top .social-main-tabs a.active::after {
      background: var(--gold-500, #c9a227);
    }
    .social-video-page .social-video-top .social-icon-btn {
      background: rgba(201, 162, 39, 0.15) !important;
      color: var(--gold-800, #6b4f10) !important;
    }
#videoFeedScope[hidden],
body.social-video-profile-feed .social-feed-scope--video {
  display: none !important;
}
  </style>
</head>
<body class="social-video-page">
  <header class="social-video-top social-top">
    <div class="social-main-tabs">
      <a href="/explore.html?tab=following&app=1">Following</a>
      <a href="/video.html?app=1" class="active">Video</a>
      <a href="/square.html?app=1">Square</a>
      <button type="button" class="social-icon-btn" data-social-camera style="margin-left:auto"><i class="fas fa-camera"></i></button>
    </div>
    <div class="social-feed-scope social-feed-scope--video" id="videoFeedScope" role="tablist" aria-label="Feed">
      <button type="button" class="social-feed-scope-btn is-active" data-feed="for_you">For You</button>
      <button type="button" class="social-feed-scope-btn" data-feed="following">Following</button>
      <button type="button" class="social-feed-scope-btn" data-feed="latest">Latest</button>
    </div>
  </header>

  <div id="reelsMount" class="social-reels-wrap">
    <div class="social-reel-ui" id="reelUi">
      <div class="social-reel-bottom">
        <p class="social-reel-name" id="videoName">Creator</p>
        <p class="social-reel-caption" id="videoCaption"></p>
      </div>

      <div class="social-reel-rail" id="reelActions">
        <div class="social-reel-author">
          <button type="button" class="social-reel-avatar-btn" id="videoAvatarBtn" aria-label="View profile">
            <img id="videoAvatar" src="" alt="">
          </button>
          <button type="button" class="social-reel-follow-pill" id="followBtn" aria-label="Follow">+</button>
        </div>

        <button type="button" class="social-reel-action" data-action="like" aria-label="Like">
          <span class="social-reel-action-icon"><i class="fas fa-heart"></i></span>
          <span class="social-reel-action-count" id="likeCount">0</span>
        </button>
        <button type="button" class="social-reel-action" data-action="comment" aria-label="Comment">
          <span class="social-reel-action-icon"><i class="fas fa-comment"></i></span>
          <span class="social-reel-action-count" id="commentCount">0</span>
        </button>
        <button type="button" class="social-reel-action is-gift" data-action="gift" aria-label="Gift">
          <span class="social-reel-action-icon"><i class="fas fa-gift"></i></span>
          <span class="social-reel-action-count" id="giftCount">0</span>
        </button>
        <button type="button" class="social-reel-action" data-action="share" aria-label="Share">
          <span class="social-reel-action-icon"><i class="fas fa-paper-plane"></i></span>
          <span class="social-reel-action-count" id="shareCount">0</span>
        </button>
        <button type="button" class="social-reel-action social-reel-action--danger" data-action="delete" aria-label="Delete post" hidden>
          <span class="social-reel-action-icon"><i class="fas fa-trash"></i></span>
          <span class="social-reel-action-count">Del</span>
        </button>
      </div>
    </div>
  </div>

  <div id="social-bottom-nav-mount"></div>

  <script src="app.js?v=20260730-fastnav2"></script>
  <script src="social-wallet.js" defer></script>
  <script src="social-ui.js"></script>
  <script src="social-fx.js?v=20260730-cx2" defer></script>
  <script src="live-emoji-data.js?v=20260730-gifts" defer></script>
  <script src="social-creator-telemetry.js?v=20260730-stab1" defer></script>
  <script src="social-creator-polish.js?v=20260730-cx3" defer></script>
  <script src="social-creator-identity.js?v=20260730-cx2"></script>
  <script src="social-interactions.js?v=20260820-ig-grid"></script>
  <script src="social-create-post.js?v=20260802-video-60s" defer></script>
  <script src="ap-soft-nav.js?v=20260730-fastnav4"></script>
  <script src="social-shell.js?v=20260730-fastnav4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const scope = document.getElementById('videoFeedScope');
      const current = window.SocialInteractions?.currentFeedScope?.() || 'for_you';
      scope?.querySelectorAll('[data-feed]').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.feed === current);
        btn.addEventListener('click', () => {
          const next = SocialInteractions.setFeedScope(btn.dataset.feed);
          scope.querySelectorAll('[data-feed]').forEach((b) => b.classList.toggle('is-active', b.dataset.feed === next));
          SocialInteractions.initVideoPage('reelsMount', { soft: true, feed: next }).catch(() => {});
        });
      });
      SocialShell.initPage({ activeNav: 'video', reelsId: null });
      SocialCreatePost.bindCameraButtons();
      /* Discovery rails stay on Square only — Video is immersive reels */
      Promise.resolve(SocialInteractions.initVideoPage('reelsMount', { feed: current })).catch(() => {});
    });
  </script>
</body>
</html>
