<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Discover Creators - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css?v=20260702-follow-fix">
  <link rel="stylesheet" href="social-features.css?v=20260702-follow-fix">
  <script src="native-session-restore.js"></script>
  <script src="ap-config.js"></script>
  <script src="ap-native-boot.js"></script>
</head>
<body class="social-discover-page">
  <header class="discover-creators-header">
    <a href="javascript:history.back()" class="discover-creators-back" data-ap-back aria-label="Back"><i class="fas fa-arrow-left"></i></a>
    <div class="discover-creators-head-text">
      <h1>Discover Creators</h1>
      <p>Top engaged hosts &amp; creators this week</p>
    </div>
    <a href="/rankings.html?app=1" class="discover-creators-back" aria-label="Rankings"><i class="fas fa-trophy"></i></a>
  </header>

  <div class="discover-creators-tabs">
    <button type="button" class="discover-creators-tab active" data-period="weekly">This week</button>
    <button type="button" class="discover-creators-tab" data-period="monthly">This month</button>
  </div>

  <div class="discover-creators-promo">
    <i class="fas fa-fire"></i>
    <span>Follow creators you like — tap a profile to see their gifts, live stats &amp; posts.</span>
  </div>

  <div class="discover-creators-list" id="discoverCreatorsList">
    <div class="discover-creators-loading"><i class="fas fa-spinner fa-spin"></i> Loading creators…</div>
  </div>

  <div id="social-bottom-nav-mount"></div>

  <script src="app.js?v=20260702-follow-fix"></script>
  <script src="social-ui.js?v=20260624-profile-url-fix"></script>
  <script src="auth-guard.js"></script>
  <script src="social-creator-telemetry.js?v=20260730-stab1"></script>
  <script src="social-creator-identity.js?v=20260730-cx2"></script>
  <script src="social-interactions.js?v=20260624-profile-url-fix"></script>
  <script src="social-shell.js?v=20260624-profile-url-fix"></script>
  <script src="social-nav.js"></script>
  <script>
    const API_ROOT = (window.AP_SERVICES_API_ROOT || 'https://api.apservices.in/api').replace(/\/+$/, '');
    const DISCOVER_PATH = '/social/discover/creators';
    let currentPeriod = 'weekly';

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function avatarUrl(creator) {
      const pic = creator.profilePic || creator.profile_pic;
      if (pic) {
        if (window.SocialShell?.getImageUrl) {
          const built = SocialShell.getImageUrl(pic, creator.profileUpdatedAt || creator.updated_at);
          if (built) return built;
        }
        const raw = String(pic).trim();
        if (/^https?:\/\//i.test(raw)) return raw;
        if (raw.startsWith('//')) return 'https:' + raw;
        const base = (window.CONFIG?.BACKEND_URL || 'https://api.apservices.in').replace(/\/$/, '');
        return base + (raw.startsWith('/') ? raw : '/' + raw);
      }
      if (window.SocialUI?.avatarUrl) return SocialUI.avatarUrl(creator.displayName);
      return 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(creator.displayName || 'c');
    }

    function formatCount(n) {
      const v = Number(n || 0);
      if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
      if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
      return String(v);
    }

    function discoverQuery(period) {
      return '?period=' + encodeURIComponent(period) + '&limit=40';
    }

    function discoverRequestUrls(period) {
      const q = discoverQuery(period);
      const root = (window.CONFIG?.API_URL || window.AP_SERVICES_API_ROOT || 'https://api.apservices.in/api').replace(/\/+$/, '');
      return [root + DISCOVER_PATH + q];
    }

    function authHeaders() {
      const headers = { Accept: 'application/json' };
      const token = localStorage.getItem('token');
      if (token) headers.Authorization = 'Bearer ' + token;
      return headers;
    }

    function xhrGet(url, headers) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = 20000;
        Object.keys(headers || {}).forEach((k) => xhr.setRequestHeader(k, headers[k]));
        xhr.onload = () => resolve({ ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, text: xhr.responseText || '' });
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.ontimeout = () => reject(new Error('Request timed out'));
        xhr.send();
      });
    }

    async function httpGet(url, headers) {
      try {
        const res = await fetch(url, {
          method: 'GET',
          credentials: 'omit',
          headers,
          mode: 'cors',
        });
        return { ok: res.ok, status: res.status, text: await res.text() };
      } catch (e) {
        const msg = String(e?.message || '');
        if (/malformed|invalid url|failed to fetch|network/i.test(msg)) {
          return xhrGet(url, headers);
        }
        throw e;
      }
    }

    function parseDiscoverResponse(res) {
      let data;
      try {
        data = JSON.parse(res.text);
      } catch (_e) {
        throw new Error('Invalid server response');
      }
      if (!res.ok || !data?.success) {
        throw new Error(data?.message || 'HTTP ' + res.status);
      }
      return data.data?.creators || [];
    }

    async function fetchCreators(period) {
      const headers = authHeaders();
      const url = discoverRequestUrls(period)[0];

      try {
        const res = await httpGet(url, headers);
        return parseDiscoverResponse(res);
      } catch (e) {
        console.warn('discover httpGet:', e);
      }

      if (window.SocialInteractions?.apiSocial) {
        try {
          const data = await SocialInteractions.apiSocial('GET', DISCOVER_PATH + discoverQuery(period));
          if (data?.success) return data.data?.creators || [];
        } catch (apiErr) {
          console.warn('discover API:', apiErr);
          throw apiErr;
        }
      }

      throw new Error('Could not load creators');
    }

    function isFollowingSafe(creator) {
      try {
        if (window.SocialInteractions?.isFollowing) {
          return SocialInteractions.isFollowing(creator.id, creator.displayName);
        }
      } catch (_e) {}
      return Boolean(creator.isFollowing);
    }

    function renderCreatorRow(creator, index) {
      const rank = creator.rank || index + 1;
      const name = esc(creator.displayName || 'Creator');
      const id = esc(creator.id);
      const href = esc(
        creator.profileHref ||
          '/creator-profile.html?userId=' + encodeURIComponent(creator.id) + '&name=' + encodeURIComponent(creator.displayName || '') + '&app=1'
      );
      const badges =
        window.SocialCreatorIdentity?.renderBadgesHtml?.(
          {
            ...creator,
            isLive: false,
          },
          'compact'
        ) || '';
      const liveBadge = creator.isLive
        ? '<span class="discover-live-pill"><i class="fas fa-circle"></i> LIVE · ' + formatCount(creator.liveViewers) + '</span>'
        : '';
      const following = isFollowingSafe(creator);
      const followLabel = following ? 'Following' : 'Follow';
      return (
        '<article class="discover-creator-card" data-user-id="' + id + '">' +
          '<a class="discover-creator-main" href="' + href + '">' +
            '<span class="discover-creator-rank">#' + rank + '</span>' +
            '<img src="' + esc(avatarUrl(creator)) + '" alt="" class="discover-creator-avatar" loading="lazy">' +
            '<div class="discover-creator-info">' +
              '<div class="discover-creator-name-row"><strong>' + name + '</strong> ' + badges + ' ' + liveBadge + '</div>' +
              '<div class="discover-creator-metrics">' +
                '<span><i class="fas fa-bolt"></i> ' + esc(creator.engagementLabel || '0') + ' engagement</span>' +
                '<span><i class="fas fa-user-friends"></i> ' + formatCount(creator.followers) + ' followers</span>' +
                (creator.giftCount ? '<span><i class="fas fa-gift"></i> ' + formatCount(creator.giftCount) + ' gifts</span>' : '') +
              '</div>' +
            '</div>' +
          '</a>' +
          '<button type="button" class="discover-creator-follow' + (following ? ' is-on' : '') + '" data-follow-id="' + id + '" data-follow-name="' + name + '">' +
            followLabel +
          '</button>' +
        '</article>'
      );
    }

    function bindCreatorActions() {
      document.querySelectorAll('.discover-creator-follow').forEach((btn) => {
        if (btn.dataset.bound) return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.dataset.followId;
          const name = btn.dataset.followName;
          if (!id) return;
          if (!(window.Auth?.hasSession?.() || localStorage.getItem('token'))) {
            location.href = '/app-auth.html?app=1&redirect=' + encodeURIComponent(location.pathname + location.search);
            return;
          }
          if (!window.SocialInteractions?.toggleFollow) {
            if (window.SocialUI) SocialUI.toast('Please wait and try again', 'warning');
            return;
          }
          const now = await SocialInteractions.toggleFollow(id, name);
          btn.textContent = now ? 'Following' : 'Follow';
          btn.classList.toggle('is-on', now);
          if (window.SocialUI) SocialUI.toast(now ? 'Following ' + name : 'Unfollowed ' + name, now ? 'success' : 'info');
        });
      });
    }

    async function loadCreators() {
      const list = document.getElementById('discoverCreatorsList');
      list.innerHTML = '<div class="discover-creators-loading"><i class="fas fa-spinner fa-spin"></i> Loading creators…</div>';
      try {
        const creators = await fetchCreators(currentPeriod);
        if (!creators.length) {
          list.innerHTML = '<div class="discover-creators-empty"><i class="fas fa-user-astronaut"></i><p>No creators yet</p><a href="/explore.html?app=1" class="btn-open">Browse live</a></div>';
          return;
        }
        list.innerHTML = creators.map(renderCreatorRow).join('');
        bindCreatorActions();
      } catch (err) {
        console.error('discover creators:', err);
        const msg = esc(err?.message || 'Could not load creators');
        list.innerHTML = '<div class="discover-creators-empty"><p>' + msg + '</p><button type="button" class="btn-open" id="discoverRetry">Retry</button></div>';
        document.getElementById('discoverRetry')?.addEventListener('click', () => loadCreators());
      }
    }

    window.addEventListener('load', async () => {
      if (window.SocialShell?.initPage) SocialShell.initPage({ activeNav: 'explore' });
      if (window.SocialInteractions?.refreshSocialCaches) {
        await SocialInteractions.refreshSocialCaches().catch(() => {});
      }
      document.querySelectorAll('.discover-creators-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.dataset.period === currentPeriod) return;
          document.querySelectorAll('.discover-creators-tab').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          currentPeriod = btn.dataset.period;
          loadCreators();
        });
      });
      loadCreators();
    });
  </script>
</body>
</html>
