<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ee">
  <title>Recharge Coins - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="social-live.css">
</head>
<body data-live-page="coins-recharge" class="recharge-page">
  <header class="recharge-header">
    <a href="/store.html?app=1" aria-label="Back"><i class="fas fa-arrow-left"></i></a>
    <h1>Recharge coins</h1>
  </header>

  <p style="font-size:13px;color:#8b6914;margin:0 0 16px">Scan our UPI QR (same as service booking), pay, then enter your UTR below.</p>

  <div class="recharge-qr-card">
    <img src="assets/payment-qr.png" alt="UPI QR Code" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <p style="display:none;font-size:12px;color:#8b6914">Add <code>frontend/assets/payment-qr.png</code> for your UPI QR.</p>
    <p class="amount" id="rechargeAmount">₹199</p>
    <p style="font-size:12px;color:#8b6914;margin:0">Pay via PhonePe / GPay / Paytm</p>
  </div>

  <div class="recharge-amounts" id="rechargeAmountBtns">
    <button type="button">₹99</button>
    <button type="button" class="active">₹199</button>
    <button type="button">₹499</button>
    <button type="button">₹999</button>
    <button type="button">₹1999</button>
    <button type="button">₹4999</button>
  </div>

  <div class="recharge-field">
    <label for="rechargeUtr">UPI transaction reference (UTR)</label>
    <input type="text" id="rechargeUtr" placeholder="12-digit UTR after payment" autocomplete="off" inputmode="numeric">
  </div>

  <button type="button" class="recharge-submit" id="rechargeSubmit">I have paid — submit</button>
  <p class="recharge-note">Coins are credited after manual verification (same flow as booking QR payment).</p>

  <script src="app.js"></script>
  <script src="auth-guard.js"></script>
  <script src="social-live.js"></script>
</body>
</html>
