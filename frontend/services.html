<!DOCTYPE html>
<html lang="en" class="social-app social-native">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
    <title>Services - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
  <link rel="stylesheet" href="social-theme.css?v=20260823-market">
  <link rel="stylesheet" href="social-features.css?v=20260823-market">
  <link rel="stylesheet" href="social-shot-skin.css?v=20260823-market">
  <link rel="stylesheet" href="social-ui-fix.css?v=20260823-market">
  <script src="native-session-restore.js?v=20260811-boot"></script>
  <script src="ap-config.js"></script>
  <script src="ap-native-boot.js?v=20260811-boot"></script>
</head>
<body class="social-services-page">
  <header class="svc-top">
    <a href="/explore.html?app=1" class="social-icon-btn" data-ap-back aria-label="Back"><i class="fas fa-arrow-left"></i></a>
    <h1>Services</h1>
    <a href="/customer-dashboard.html?app=1" class="social-icon-btn" aria-label="My bookings"><i class="fas fa-clipboard-list"></i></a>
  </header>

  <div class="social-search svc-search">
    <i class="fas fa-search"></i>
    <input type="search" id="svcSearch" placeholder="Plumber, beauty, AC repair…" autocomplete="off">
  </div>

  <div class="svc-chips" id="svcChips" role="tablist" aria-label="Service categories"></div>

  <section class="svc-hero" id="svcHero">
    <div class="svc-hero-copy">
      <p class="svc-hero-kicker">At your door</p>
      <h2>Book a trusted pro in minutes</h2>
      <p>Plumbing, electrical, cleaning, beauty — same cream-gold flow as the rest of AP.</p>
    </div>
    <button type="button" class="svc-hero-cta" id="svcHeroCta">Browse pros</button>
  </section>

  <div class="svc-steps" aria-hidden="true">
    <div><span>1</span>Pick</div>
    <div><span>2</span>Schedule</div>
    <div><span>3</span>Done</div>
  </div>

  <div class="svc-section-row">
    <h3 id="svcHeading">For you</h3>
    <span id="svcCount"></span>
  </div>

  <div id="svcGrid" class="svc-grid" aria-live="polite"></div>
  <div id="social-bottom-nav-mount"></div>
  <div id="toast" class="toast"></div>

  <script src="app.js?v=20260823-market"></script>
  <script src="social-ui.js?v=20260823-market"></script>
  <script src="social-shell.js?v=20260823-market"></script>
  <script src="social-nav.js"></script>
  <script>
    const CATS = [
      { id: '', label: 'All', icon: 'fa-layer-group' },
      { id: 'plumbing', label: 'Plumbing', icon: 'fa-faucet' },
      { id: 'electrical', label: 'Electrical', icon: 'fa-bolt' },
      { id: 'cleaning', label: 'Cleaning', icon: 'fa-broom' },
      { id: 'beauty', label: 'Beauty', icon: 'fa-spa' },
      { id: 'painting', label: 'Painting', icon: 'fa-paint-roller' },
      { id: 'ac-repair', label: 'AC Repair', icon: 'fa-snowflake' },
      { id: 'carpentry', label: 'Carpentry', icon: 'fa-hammer' },
      { id: 'appliance', label: 'Appliances', icon: 'fa-plug' },
    ];
    const CAT_ICONS = {
      plumbing: 'fa-faucet', electrical: 'fa-bolt', cleaning: 'fa-broom', beauty: 'fa-spa',
      beautician: 'fa-spa', barber: 'fa-scissors', painting: 'fa-paint-roller',
      'ac-repair': 'fa-snowflake', ac: 'fa-snowflake', carpentry: 'fa-hammer',
      appliance: 'fa-plug', appliances: 'fa-plug', gardening: 'fa-leaf', pest: 'fa-bug',
    };

    const params = new URLSearchParams(location.search);
    let activeCat = String(params.get('category') || '').toLowerCase();
    let query = String(params.get('search') || params.get('q') || '').trim();

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function appHref(path) {
      const u = new URL(path, location.origin);
      u.searchParams.set('app', '1');
      return u.pathname + u.search;
    }
    function mediaUrl(path) {
      if (window.SocialShell?.getImageUrl) return SocialShell.getImageUrl(path);
      if (!path) return null;
      if (/^https?:\/\//i.test(path)) return path;
      if (typeof window.joinApiUrl === 'function') {
        const base = String(window.AP_SERVICES_API_ROOT || '').replace(/\/api\/?$/, '');
        return (base || '') + (path.startsWith('/') ? path : '/' + path);
      }
      return path.startsWith('/') ? path : '/' + path;
    }
    function catIcon(cat) {
      const key = String(cat || '').toLowerCase().replace(/\s+/g, '-');
      return CAT_ICONS[key] || 'fa-screwdriver-wrench';
    }
    function formatPrice(n) {
      const v = Number(n);
      if (!Number.isFinite(v) || v <= 0) return 'Ask';
      return '₹' + v.toLocaleString('en-IN');
    }
    function ratingHtml(svc) {
      const r = Number(svc.rating || svc.avg_rating || 0);
      const n = Number(svc.worker_count || svc.worker_count || 0);
      if (r) return `<span class="svc-rating"><i class="fas fa-star"></i>${r.toFixed(1)}</span>`;
      if (n > 0) return `<span class="svc-rating">${n} pro${n === 1 ? '' : 's'}</span>`;
      return '';
    }
    function matchesCat(svc, cat) {
      if (!cat) return true;
      const raw = String(svc.category || '').toLowerCase();
      const slug = raw.replace(/\s+/g, '-');
      if (slug === cat || raw === cat) return true;
      if (cat === 'ac-repair') return /ac|air.?cond/i.test(raw);
      if (cat === 'appliance') return /appliance|repair/i.test(raw);
      if (cat === 'beauty') return /beaut|barber|salon|spa/i.test(raw);
      if (cat === 'cleaning') return /clean/i.test(raw);
      if (cat === 'electrical') return /electric/i.test(raw);
      if (cat === 'plumbing') return /plumb/i.test(raw);
      if (cat === 'painting') return /paint/i.test(raw);
      if (cat === 'carpentry') return /carpent|furniture|wood/i.test(raw);
      return raw.includes(cat.replace(/-/g, ' '));
    }
    function dedupeServices(rows) {
      const map = new Map();
      for (const s of rows) {
        const key = String(s.name || s.id).toLowerCase().trim();
        const score = Number(s.worker_count || s.worker_count || 0);
        const prev = map.get(key);
        if (!prev || score > Number(prev.worker_count || prev.worker_count || 0)) map.set(key, s);
      }
      return [...map.values()];
    }

    function renderChips() {
      const el = document.getElementById('svcChips');
      el.innerHTML = CATS.map((c) => {
        const on = (c.id || '') === (activeCat || '');
        return `<button type="button" class="${on ? 'is-on' : ''}" data-cat="${escapeHtml(c.id)}" role="tab" aria-selected="${on}">
          <i class="fas ${c.icon}"></i>${escapeHtml(c.label)}
        </button>`;
      }).join('');
      el.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeCat = btn.dataset.cat || '';
          renderChips();
          loadServices();
        });
      });
    }

    function skeleton() {
      return Array.from({ length: 6 }, () => '<div class="svc-card svc-skel"></div>').join('');
    }

    function emptyHtml(msg) {
      return `<div class="svc-empty">
        <div class="svc-empty-icon"><i class="fas fa-house-chimney"></i></div>
        <h3>${escapeHtml(msg)}</h3>
        <p>Pros in your city show up here. Try another category, or check back soon.</p>
      </div>`;
    }

    function cardHtml(svc) {
      const img = mediaUrl(svc.image_url || svc.image || svc.cover_url);
      const name = escapeHtml(svc.name || 'Service');
      const cat = escapeHtml(svc.category || 'Home');
      const desc = escapeHtml(String(svc.description || '').slice(0, 72));
      const id = encodeURIComponent(svc.id);
      const icon = catIcon(svc.category);
      const cover = img
        ? `<img src="${escapeHtml(img)}" alt="" loading="lazy">`
        : `<i class="fas ${icon}"></i>`;
      return `<article class="svc-card" data-id="${id}">
        <div class="svc-cover">${cover}<span class="svc-pill">${cat}</span></div>
        <div class="svc-body">
          <h4>${name}</h4>
          ${desc ? `<p>${desc}</p>` : ''}
          <div class="svc-meta">
            ${ratingHtml(svc)}
            <strong>${formatPrice(svc.base_price || svc.price)}${String(svc.price_type || '').toLowerCase() === 'hourly' ? '/hr' : ''}</strong>
            </div>
          <button type="button" class="svc-book" data-book="${id}">Book</button>
        </div>
      </article>`;
    }

        async function loadServices() {
      const grid = document.getElementById('svcGrid');
      const countEl = document.getElementById('svcCount');
      const heading = document.getElementById('svcHeading');
      grid.classList.remove('is-empty');
      grid.innerHTML = skeleton();
      heading.textContent = activeCat
        ? (CATS.find((c) => c.id === activeCat)?.label || activeCat) + ' near you'
        : (query ? 'Results' : 'For you');
      try {
        const res = await API.get('/services');
        let rows = res?.data || res?.services || [];
        if (!Array.isArray(rows)) rows = [];
        rows = dedupeServices(rows);
        if (activeCat) rows = rows.filter((s) => matchesCat(s, activeCat));
        if (query) {
          const ql = query.toLowerCase();
          rows = rows.filter((s) =>
            [s.name, s.category, s.description].join(' ').toLowerCase().includes(ql)
          );
        }
        countEl.textContent = rows.length ? rows.length + ' available' : '';
        if (!rows.length) {
          grid.classList.add('is-empty');
          grid.innerHTML = emptyHtml(query || activeCat ? 'No matches yet' : 'Pros coming soon');
          return;
        }
        grid.innerHTML = rows.map(cardHtml).join('');
        grid.querySelectorAll('.svc-card').forEach((card) => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('[data-book]')) return;
            goBook(card.dataset.id);
          });
        });
        grid.querySelectorAll('[data-book]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            goBook(btn.dataset.book);
          });
        });
      } catch (err) {
        grid.classList.add('is-empty');
        grid.innerHTML = emptyHtml(err.message || 'Could not load services');
        countEl.textContent = '';
      }
    }

    function goBook(id) {
      if (!id) return;
      const user = window.Auth?.getUser?.();
      const dest = appHref('/booking.html?service=' + id);
            if (!user) {
        if (window.Toast?.show) Toast.show('Please login to book a service', 'warning');
        location.href = '/login.html?redirect=' + encodeURIComponent(dest);
                return;
            }
      location.href = dest;
    }

    document.addEventListener('DOMContentLoaded', () => {
      SocialShell?.initPage?.({ activeNav: 'explore' });
      renderChips();
      const input = document.getElementById('svcSearch');
      if (query) input.value = query;
      let t;
      input.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          query = input.value.trim();
          loadServices();
        }, 280);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        query = input.value.trim();
        loadServices();
      });
      document.getElementById('svcHeroCta').addEventListener('click', () => {
        document.getElementById('svcGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      loadServices();
    });
    </script>
</body>
</html>
