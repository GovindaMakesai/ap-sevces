<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9a227">
  <title>Topic - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="social-features.css">
</head>
<body class="social-topic-watch-page">
  <header class="social-topic-watch-header">
    <button type="button" class="social-icon-btn" onclick="history.back()" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
    <h1 id="topicTitle">Topic</h1>
    <span style="width:40px"></span>
  </header>

  <div class="social-topic-watch-body">
    <div class="social-topic-hero" id="topicHero"></div>
    <p class="social-topic-desc" id="topicDesc"></p>

    <div class="social-topic-actions">
      <button type="button" class="social-btn-orange" id="topicJoinBtn"><i class="fas fa-users"></i> Join voice party</button>
      <button type="button" class="social-btn-outline" id="topicLiveBtn"><i class="fas fa-video"></i> Go live in topic</button>
      <button type="button" class="social-btn-outline" id="topicWatchBtn"><i class="fas fa-play"></i> Watch videos</button>
    </div>

    <h3 class="social-topic-grid-title">Moments in this topic</h3>
    <div class="social-topic-moment-grid" id="topicMoments"></div>
  </div>

  <div id="social-bottom-nav-mount"></div>

  <script src="app.js"></script>
  <script src="social-ui.js"></script>
  <script src="social-interactions.js"></script>
  <script src="social-shell.js"></script>
  <script>
    const TOPICS = [
      { title: '#Chatting', desc: 'Hang out, talk, and meet new friends live.', img: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800&q=80' },
      { title: '#MakeFriends', desc: 'Find your crew — voice rooms and short videos.', img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80' },
      { title: '#HomeServices', desc: 'Pros sharing tips, before/after, and bookings.', img: 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=800&q=80' },
      { title: '#Singing', desc: 'Open mic vibes — covers, karaoke, and collabs.', img: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800&q=80' },
      { title: '#Beauty', desc: 'Looks, skincare, and style inspiration.', img: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=80' },
      { title: '#Esports', desc: 'Clips, highlights, and match-day energy.', img: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=800&q=80' },
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const idx = parseInt(new URLSearchParams(location.search).get('topic') || '0', 10) || 0;
      const t = TOPICS[idx % TOPICS.length];
      document.getElementById('topicTitle').textContent = t.title;
      document.getElementById('topicDesc').textContent = t.desc;
      document.getElementById('topicHero').innerHTML = `<img src="${t.img}" alt="${t.title}">`;
      const moments = document.getElementById('topicMoments');
      const thumbs = [
        'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=400&q=80',
        'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&q=80',
        'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400&q=80',
        'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&q=80',
      ];
      moments.innerHTML = thumbs
        .map((src, i) => `<button type="button" class="social-topic-moment" data-i="${i}"><img src="${src}" alt=""><span><i class="fas fa-play"></i></span></button>`)
        .join('');
      moments.querySelectorAll('.social-topic-moment').forEach((btn) => {
        btn.addEventListener('click', () => {
          location.href = '/video.html?topic=' + idx + '&app=1';
        });
      });
      document.getElementById('topicJoinBtn').addEventListener('click', () => {
        if (window.SocialShell?.openBroadcastPicker) SocialShell.openBroadcastPicker('party', { topic: idx });
        else SocialShell.goStartParty();
      });
      document.getElementById('topicLiveBtn').addEventListener('click', () => {
        if (window.SocialShell?.openBroadcastPicker) SocialShell.openBroadcastPicker('live', { topic: idx });
        else SocialShell.goStartLiveBroadcast();
      });
      document.getElementById('topicWatchBtn').addEventListener('click', () => {
        location.href = '/video.html?topic=' + idx + '&app=1';
      });
      SocialShell.initPage({ activeNav: 'video' });
      if (window.SocialUI) SocialUI.bindAvatarFallbacks(document);
    });
  </script>
</body>
</html>
