<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <script>
    (function () {
      var params = new URLSearchParams(location.search || '');
      params.set('tab', 'party');
      if (!params.has('app')) params.set('app', '1');
      location.replace('/explore.html?' + params.toString());
    })();
  </script>
</head>
<body></body>
</html>
