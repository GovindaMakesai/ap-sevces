<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Party - AP Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
</head>
<body>
  <header class="social-top">
    <div class="social-sub-tabs">
      <a href="/explore.html?tab=following">Following</a>
      <a href="/party.html" class="active">Party</a>
    </div>
    <div class="social-main-tabs" style="padding-top:0;min-height:40px">
      <span style="flex:1"></span>
      <div class="social-top-actions">
        <a href="/rankings.html" class="social-icon-btn"><i class="fas fa-trophy"></i></a>
        <a href="/services.html" class="social-global-pill"><i class="fas fa-globe-asia"></i> Global <i class="fas fa-chevron-down" style="font-size:10px"></i></a>
      </div>
    </div>
    <div class="social-search">
      <i class="fas fa-search"></i>
      <input type="search" data-social-search placeholder="ID number or nickname" autocomplete="off">
    </div>
  </header>

  <section class="social-banner-wrap">
    <div class="social-banner social-banner--invite">
      <div class="social-banner-content social-banner-content--center">
        <h2>Invite Friends</h2>
        <p>Up to <span class="coin">🪙</span> 10k / invite</p>
      </div>
    </div>
    <div class="social-banner-dots"><span class="active"></span><span></span></div>
  </section>

  <div class="social-grid" id="partyGrid"></div>

  <a href="/chat.html" class="social-start-live social-fab-party"><i class="fas fa-video"></i> PARTY</a>
  <div id="social-bottom-nav-mount"></div>

  <script src="app.js"></script>
  <script src="social-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SocialShell.initPage({ activeNav: 'party', gridId: 'partyGrid', gridLimit: 12, partyGrid: true });
    });
  </script>
</body>
</html>
