<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <script>
    (function () {
      var q = location.search || '';
      if (!/[?&]app=1\b/.test(q)) q += (q ? '&' : '?') + 'app=1';
      location.replace('/explore.html' + q);
    })();
  </script>
</head>
<body></body>
</html>
