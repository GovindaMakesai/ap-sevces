<!DOCTYPE html>
<html lang="en" class="auth-guest auth-native">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Welcome - AP Live Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="social-theme.css">
  <link rel="stylesheet" href="social-auth.css?v=20260723-live-copy">
  <link rel="stylesheet" href="auth-native-overrides.css?v=20260723-live-copy">
  <script src="native-session-restore.js?v=20260811-boot"></script>
  <script src="social-auth-init.js"></script>
</head>
<body class="auth-gate-page auth-native">
  <div class="auth-gate-scroll">
    <div class="auth-gate-card">
      <a href="/app-auth.html" class="auth-logo auth-logo--img" aria-label="AP Live Service">
        <img src="/ap-logo.png" alt="AP Live Service" width="96" height="96">
      </a>
      <h1>Welcome</h1>
      <p class="auth-gate-sub">Sign up or sign in with Google, Facebook, or GitHub.</p>

      <div id="alertContainer"></div>

      <div class="auth-social-login">
        <button type="button" class="auth-oauth-btn google" id="googleLogin">
          <i class="fab fa-google"></i> Continue with Google
        </button>
        <button type="button" class="auth-oauth-btn facebook" id="facebookLogin">
          <i class="fab fa-facebook-f"></i> Continue with Facebook
        </button>
        <button type="button" class="auth-oauth-btn github" id="githubLogin">
          <i class="fab fa-github"></i> Continue with GitHub
        </button>
      </div>

      <div class="auth-benefits-compact">
        <p class="auth-benefits-title"><i class="fas fa-video"></i> Why AP Live Service?</p>
        <ul>
          <li><i class="fas fa-check-circle"></i> Go live &amp; join party rooms</li>
          <li><i class="fas fa-check-circle"></i> Send gifts &amp; earn rewards</li>
          <li><i class="fas fa-check-circle"></i> Host &amp; agency tools</li>
          <li><i class="fas fa-check-circle"></i> Secure login &amp; wallet</li>
        </ul>
      </div>

      <blockquote class="auth-testimonial-compact">
        “Love going live and connecting with my audience on AP Live!”
        <cite>— Host community</cite>
      </blockquote>
    </div>
  </div>

  <script src="ap-config.js"></script>
  <script src="app.js?v=20260811-boot"></script>
  <script src="auth-guard.js?v=20260811-boot"></script>
  <script src="auth-oauth.js?v=20260716-deauth-msg"></script>
  <script src="referral-hook.js?v=20260716-invite-connect"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.APReferralHook?.captureRefFromUrl?.();
      if (window.AuthOAuth) AuthOAuth.bindOAuthButtons();
      AuthOAuth.showAuthPageErrors?.();
    });
  </script>
</body>
</html>
