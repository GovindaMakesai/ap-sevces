# HTTP only — used briefly before certbot issues SSL cert
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'AP Services — waiting for SSL. Run certbot next.';
        add_header Content-Type text/plain;
    }
}
